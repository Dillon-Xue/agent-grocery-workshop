<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkBuddy 控制台</title>
<style>
:root{
  --bg:#070a0f; --surface:#0d1219; --surface-2:#131a24; --surface-3:#1a2230;
  --border:rgba(255,255,255,.07); --border-hover:rgba(255,255,255,.16);
  --text:#e6edf3; --dim:#7d8da3; --faint:#48566a;
  --cyan:#22d3ee; --green:#34d399; --amber:#fbbf24; --red:#f87171; --purple:#a78bfa; --blue:#60a5fa;
  --mono:'SF Mono',ui-monospace,'JetBrains Mono','Cascadia Code',Consolas,monospace;
  --header-h:78px;
}
/* ── 亮色主题 ── */
:root[data-theme='light']{
  --bg:#eceff4; --surface:#ffffff; --surface-2:#f3f5f9; --surface-3:#e6eaf1;
  --border:rgba(15,23,42,.10); --border-hover:rgba(15,23,42,.24);
  --text:#0f172a; --dim:#5b6b7e; --faint:#94a3b8;
}
:root[data-theme='light'] body::before{
  background:radial-gradient(900px 500px at 78% -8%,rgba(34,211,238,.12),transparent 60%),
             radial-gradient(700px 400px at 0% 100%,rgba(167,139,250,.10),transparent 55%);
}
:root[data-theme='light'] .sidebar{background:rgba(255,255,255,.9)}
:root[data-theme='light'] .topbar{background:var(--bg)}
:root[data-theme='light'] .arena{
  background:radial-gradient(ellipse at 50% 100%,rgba(34,211,238,.12) 0%,transparent 60%),
             radial-gradient(ellipse at 20% 20%,rgba(167,139,250,.08) 0%,transparent 45%),
             radial-gradient(ellipse at 80% 30%,rgba(52,211,153,.06) 0%,transparent 40%),
             linear-gradient(180deg,rgba(34,211,238,.04),rgba(167,139,250,.05)),
             var(--surface);
}
:root[data-theme='light'] .capsule{background:rgba(255,255,255,.9);box-shadow:0 2px 10px rgba(15,23,42,.12)}
:root[data-theme='light'] .wb-avatar{filter:drop-shadow(0 0 36px rgba(34,211,238,.18)) drop-shadow(0 8px 18px rgba(15,23,42,.28))}
:root[data-theme='light'] .a-hint{text-shadow:none}
:root[data-theme='light'] .proj-item{background:var(--surface)}
:root[data-theme='light'] .skill-float-backdrop{background:rgba(15,23,42,.35)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg); color:var(--text); overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(900px 500px at 78% -8%,rgba(34,211,238,.06),transparent 60%),
             radial-gradient(700px 400px at 0% 100%,rgba(167,139,250,.05),transparent 55%);
}
.app{display:flex;height:100vh;position:relative;z-index:1}

/* ── Sidebar ── */
.sidebar{
  width:236px;flex-shrink:0;background:rgba(13,18,25,.85);
  border-right:1px solid var(--border);display:flex;flex-direction:column;
  backdrop-filter:blur(12px);transition:width .22s ease;position:relative;
}
.brand{height:var(--header-h);padding:0 20px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--border)}
.brand .logo{
  width:34px;height:34px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(135deg,var(--cyan),var(--purple));
  display:grid;place-items:center;font-size:18px;box-shadow:0 0 18px rgba(34,211,238,.35);
}
.brand .t1{font-size:15px;font-weight:650;letter-spacing:.3px}
.brand .t2{font-size:11px;color:var(--dim);margin-top:1px;letter-spacing:1.5px}
.nav{flex:1;padding:14px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:3px}
.nav-label{font-size:10px;color:var(--faint);letter-spacing:1.5px;padding:14px 12px 5px;font-weight:600}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;
  color:var(--dim);cursor:pointer;font-size:13.5px;transition:.16s;user-select:none;
  border:1px solid transparent;position:relative;
}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:linear-gradient(90deg,rgba(34,211,238,.14),rgba(34,211,238,.02));color:var(--text);border-color:rgba(34,211,238,.22)}
.nav-item.active::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.nav-item .ico{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.nav-item .badge{margin-left:auto;font-size:10.5px;padding:1px 7px;border-radius:20px;background:var(--surface-3);color:var(--dim);font-family:var(--mono)}
.nav-item .badge.warn{background:rgba(251,191,36,.15);color:var(--amber)}
.nav-item .badge.danger{background:rgba(248,113,113,.15);color:var(--red)}
.side-foot{padding:13px 18px;border-top:1px solid var(--border);font-size:11px;color:var(--faint);display:flex;justify-content:space-between;align-items:center}
.side-foot .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);display:inline-block;margin-right:6px}

/* ── Sidebar toggle ── */
.sidebar-toggle{
  position:absolute;right:-12px;top:26px;width:24px;height:24px;border-radius:50%;
  background:var(--surface-2);border:1px solid var(--border);color:var(--dim);cursor:pointer;
  display:grid;place-items:center;font-size:12px;z-index:10;transition:.18s;box-shadow:0 2px 8px rgba(0,0,0,.25);
}
.sidebar-toggle:hover{background:var(--surface-3);color:var(--text);border-color:var(--border-hover)}
.sidebar.collapsed{width:58px}
.sidebar.collapsed .brand{padding:0 14px}
.sidebar.collapsed .brand .logo{margin:0 auto}
.sidebar.collapsed .brand .t1,.sidebar.collapsed .brand .t2,.sidebar.collapsed .nav-label,.sidebar.collapsed .nav-item .txt,.sidebar.collapsed .nav-item .badge,.sidebar.collapsed .side-foot span:not(.dot){display:none}
.sidebar.collapsed .nav-item{justify-content:center;padding:10px 0;gap:0}
.sidebar.collapsed .nav-item .ico{width:auto;margin:0;font-size:17px}
.sidebar.collapsed .side-foot{justify-content:center;padding:13px 0}
.sidebar.collapsed .sidebar-toggle{right:-12px;transform:rotate(180deg)}
.app.sidebar-collapsed .main{margin-left:0}

/* ── Main ── */
.main{flex:1;overflow-y:auto;padding:0}
.topbar{height:var(--header-h);padding:0 30px;position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;background:rgba(7,10,15,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);z-index:5}
.topbar h1{font-size:21px;font-weight:650;letter-spacing:.3px}
.topbar .sub{font-size:12.5px;color:var(--dim);margin-top:4px}
.backend-status{font-size:12px;display:flex;align-items:center;gap:6px;color:var(--dim);cursor:pointer;padding:5px 10px;border-radius:20px;border:1px solid transparent;transition:.15s}
.backend-status:hover{background:var(--surface-2);border-color:var(--border)}
.backend-status.ok{color:var(--green);border-color:rgba(34,197,94,.25)}
.backend-status.err{color:var(--red);border-color:rgba(248,113,113,.25)}
:root[data-theme='light'] .backend-status.ok{color:#16a34a}
:root[data-theme='light'] .backend-status.err{color:#dc2626}
.content{padding:24px 30px 40px}
.section-title{font-size:13px;font-weight:600;color:var(--dim);letter-spacing:.5px;margin:26px 0 13px;display:flex;align-items:center;gap:8px}
.section-title:first-child{margin-top:0}
.section-title::before{content:'';width:3px;height:14px;background:var(--cyan);border-radius:2px;box-shadow:0 0 8px var(--cyan)}
.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sec-head h2{font-size:16px;font-weight:600}
.sec-head .tag{margin-left:auto;font-size:10.5px;font-family:var(--mono);color:var(--dim);background:var(--surface-2);padding:2px 9px;border-radius:6px}

/* ── Grid / KPI ── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px}
.kpi-row{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:18px}
@media(max-width:1100px){.kpi-row{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.kpi-row{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:17px 18px;position:relative;overflow:hidden;transition:.18s}
.kpi:hover{border-color:var(--border-hover);transform:translateY(-2px)}
.kpi .k-ico{font-size:17px;margin-bottom:11px;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2)}
.kpi .k-val{font-size:26px;font-weight:680;font-family:var(--mono);letter-spacing:-.5px;line-height:1}
.kpi .k-lab{font-size:12px;color:var(--dim);margin-top:7px}
.kpi .k-sub{font-size:10.5px;color:var(--faint);margin-top:3px;font-family:var(--mono)}
.kpi::after{content:'';position:absolute;right:-20px;bottom:-20px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.08),transparent 70%)}
.kpi.c-cyan .k-ico{background:rgba(34,211,238,.14);color:var(--cyan)}
.kpi.c-green .k-ico{background:rgba(52,211,153,.14);color:var(--green)}
.kpi.c-amber .k-ico{background:rgba(251,191,36,.14);color:var(--amber)}
.kpi.c-purple .k-ico{background:rgba(167,139,250,.14);color:var(--purple)}
.kpi.c-red .k-ico{background:rgba(248,113,113,.14);color:var(--red)}
.kpi.c-blue .k-ico{background:rgba(96,165,250,.14);color:var(--blue)}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:stretch}
@media(max-width:920px){.two-col{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px}
.card h3{font-size:14px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card-scroll{height:clamp(280px,34vh,360px);display:flex;flex-direction:column}
.card-scroll>h3{flex-shrink:0}
.card-scroll>div{flex:1 1 auto;overflow-y:auto}
.card h3 .tag{margin-left:auto;font-size:10.5px;font-family:var(--mono);color:var(--dim);background:var(--surface-2);padding:2px 8px;border-radius:6px}

/* ── Donut ── */
.donut-wrap{display:flex;align-items:center;gap:22px}
.donut{width:138px;height:138px;flex-shrink:0;position:relative}
.donut .center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.donut .center .big{font-size:21px;font-weight:680;font-family:var(--mono)}
.donut .center .small{font-size:10.5px;color:var(--dim);margin-top:2px}
.legend{flex:1;display:flex;flex-direction:column;gap:9px;font-size:12.5px}
.legend .row{display:flex;align-items:center;gap:9px}
.legend .sw{width:11px;height:11px;border-radius:3px;flex-shrink:0}
.legend .nm{color:var(--dim)}
.legend .vl{margin-left:auto;font-family:var(--mono);color:var(--text)}

/* ── Bars ── */
.bar-row{display:flex;align-items:center;gap:11px;font-size:12.5px;margin-bottom:11px}
.bar-row .nm{width:120px;flex-shrink:0;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .track{flex:1;height:7px;background:var(--surface-3);border-radius:5px;overflow:hidden}
.bar-row .fill{height:100%;border-radius:5px;transition:.4s}
.bar-row .vl{width:64px;text-align:right;font-family:var(--mono);font-size:11.5px;color:var(--text);flex-shrink:0}

/* ── Status ── */
.status-bd{display:flex;flex-direction:column;gap:10px}
.status-bd .row{display:flex;align-items:center;gap:10px;font-size:12.5px}
.status-bd .pill{padding:2px 9px;border-radius:20px;font-size:11px;font-family:var(--mono);white-space:nowrap}
.pill.safe{background:rgba(52,211,153,.13);color:var(--green)}
.pill.warn{background:rgba(251,191,36,.13);color:var(--amber)}
.pill.danger{background:rgba(248,113,113,.13);color:var(--red)}
.pill.neutral{background:var(--surface-3);color:var(--dim)}
.status-bd .cnt{margin-left:auto;font-family:var(--mono);font-size:15px;font-weight:600}

/* ── Tools / Table ── */
.tbl-tools{display:flex;gap:9px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.search-box{flex:1;min-width:200px;position:relative}
.search-box input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:9px 13px 9px 34px;color:var(--text);font-size:13px;outline:none;transition:.16s}
.search-box input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.1)}
.search-box .si{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:14px}
.filter{cursor:pointer;padding:8px 13px;border-radius:9px;background:var(--surface);border:1px solid var(--border);color:var(--dim);font-size:12.5px;transition:.16s;user-select:none}
.filter:hover{border-color:var(--border-hover);color:var(--text)}
.filter.active{background:rgba(34,211,238,.13);border-color:rgba(34,211,238,.3);color:var(--cyan)}

.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;padding:12px 16px;font-size:11px;color:var(--dim);font-weight:600;letter-spacing:.5px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap}
thead th:hover{color:var(--text)}
thead th .ar{opacity:.4;font-size:10px;margin-left:3px}
thead th.sorted .ar{opacity:1;color:var(--cyan)}
tbody td{padding:12px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:.12s}
tbody tr:hover{background:var(--surface-2)}
.skill-name{display:flex;align-items:center;gap:10px}
.skill-name .av{width:30px;height:30px;border-radius:8px;background:var(--surface-3);display:grid;place-items:center;font-size:14px;flex-shrink:0}
.skill-name .nm{font-weight:550}
.skill-name .id{font-size:10.5px;color:var(--faint);font-family:var(--mono)}
.src-tag{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--dim)}
.tok-cell{font-family:var(--mono);font-size:12px}
.tok-cell.hot{color:var(--amber);font-weight:600}
.mini-find{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-family:var(--mono)}
.mini-find.high{color:var(--red)}
.mini-find.mid{color:var(--amber)}

/* ── Storage detail ── */
.store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:13px}
.store-card{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:15px 16px;transition:.16s;position:relative;overflow:hidden}
.store-card:hover{border-color:var(--border-hover);transform:translateY(-2px)}
.store-card .sc-top{display:flex;align-items:center;gap:10px;margin-bottom:13px}
.store-card .sc-ico{font-size:18px;width:34px;height:34px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center}
.store-card .sc-nm{font-size:13.5px;font-weight:550}
.store-card .sc-fc{font-size:10.5px;color:var(--faint);font-family:var(--mono);margin-top:1px}
.store-card .sc-sz{font-size:20px;font-weight:680;font-family:var(--mono);letter-spacing:-.5px}
.store-card .sc-sub{font-size:11px;color:var(--dim);margin-top:3px}
.safe-tag{position:absolute;top:14px;right:14px;font-size:10px;padding:2px 8px;border-radius:6px;font-weight:600}
.safe-tag.safe{background:rgba(52,211,153,.13);color:var(--green)}
.safe-tag.cautious{background:rgba(251,191,36,.13);color:var(--amber)}
.safe-tag.skill{background:rgba(96,165,250,.13);color:var(--blue)}
.safe-tag.never{background:rgba(248,113,113,.13);color:var(--red)}

/* ── Search tab ── */
.search-hero{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:18px}
.search-hero .big{font-size:15px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:9px}
.search-hero .field{display:flex;gap:10px;margin-bottom:14px}
.search-hero input{flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 15px;color:var(--text);font-size:14px;outline:none;transition:.16s}
.search-hero input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.1)}
.search-hero select{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-size:13px;outline:none;cursor:pointer}
.search-hero .run{background:linear-gradient(135deg,var(--cyan),var(--blue));color:#04121a;font-weight:650;border:none;border-radius:10px;padding:12px 22px;cursor:pointer;font-size:13.5px;transition:.16s;white-space:nowrap}
.search-hero .run:hover{filter:brightness(1.1);transform:translateY(-1px)}
.search-hero .hint{font-size:11.5px;color:var(--faint);font-family:var(--mono);line-height:1.7}
.search-hero .hint code{background:var(--surface-2);padding:2px 7px;border-radius:5px;color:var(--cyan)}

.proj-list{display:flex;flex-direction:column;gap:9px}
.proj-item{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 17px;display:flex;align-items:center;gap:14px;transition:.15s}
.proj-item:hover{border-color:var(--border-hover);background:var(--surface-2)}
.proj-item .pm{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,rgba(34,211,238,.16),rgba(167,139,250,.16));display:grid;place-items:center;font-size:16px;flex-shrink:0}
.proj-item .pn{font-weight:550;font-size:13.5px}
.proj-item .pa{font-size:11px;color:var(--faint);font-family:var(--mono);margin-top:2px}
.proj-item .pc{margin-left:auto;font-family:var(--mono);font-size:17px;font-weight:650}
.proj-item .pc-lab{font-size:10.5px;color:var(--dim);text-align:right}

.empty{text-align:center;padding:50px 20px;color:var(--faint);font-size:13px}
.empty .e-ico{font-size:38px;opacity:.4;margin-bottom:12px}

/* ════════ 零件工坊（来自 零件杂货铺）════════ */
/* 人偶 + 胶囊 */
.arena{position:relative;height:480px;border-radius:16px;overflow:hidden;border:1px solid var(--border);
  background:radial-gradient(ellipse at 50% 100%,rgba(34,211,238,.10) 0%,transparent 60%),
             radial-gradient(ellipse at 20% 20%,rgba(167,139,250,.07) 0%,transparent 45%),
             radial-gradient(ellipse at 80% 30%,rgba(52,211,153,.05) 0%,transparent 40%),
             linear-gradient(180deg,rgba(34,211,238,.03),rgba(167,139,250,.04)),
             var(--surface);margin-bottom:20px}
.arena .a-hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:10.5px;color:var(--faint);font-family:var(--mono);z-index:15;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.wb-avatar{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:92%;width:auto;z-index:10;pointer-events:none;filter:drop-shadow(0 0 40px rgba(34,211,238,.25)) drop-shadow(0 0 80px rgba(167,139,250,.15))}
.capsule{position:absolute;transform:translate(-50%,-50%);border-radius:16px;padding:5px 11px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid;white-space:nowrap;background:rgba(13,18,25,.72);backdrop-filter:blur(6px);box-shadow:0 2px 10px rgba(0,0,0,.35);transition:.15s;z-index:11}
.capsule:hover{transform:translate(-50%,-50%) scale(1.08);z-index:20}
.cap-name{font-weight:700}
.cap-count{opacity:.65;font-size:9px;margin-left:3px;font-family:var(--mono)}

/* 概览页：arena 全宽 + 胶囊点击右侧滑出详情 */
.arena-wrap{margin-bottom:20px}
.skill-float{position:fixed;top:0;right:0;bottom:0;width:460px;max-width:92vw;z-index:70;background:var(--surface);border-left:1px solid var(--border);border-radius:16px 0 0 16px;box-shadow:-12px 0 50px rgba(0,0,0,.55);display:flex;flex-direction:column;overflow:hidden;transform:translateX(100%);opacity:0;pointer-events:none;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .25s}
.skill-float.show{transform:translateX(0);opacity:1;pointer-events:auto}
.skill-float-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(2px);z-index:69;opacity:0;pointer-events:none;transition:opacity .25s}
.skill-float-backdrop.show{opacity:1;pointer-events:auto}
.skill-float .close{position:absolute;top:14px;right:18px;width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:var(--surface-2);color:var(--dim);display:grid;place-items:center;font-size:18px;cursor:pointer;transition:.15s;z-index:2}
.skill-float .close:hover{background:var(--surface-3);color:var(--text)}
.skill-detail-panel{display:flex;flex-direction:column;height:100%}
.sd-header{padding:22px 24px 18px;border-bottom:1px solid var(--border);position:relative}
.sd-header .title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.sd-header .cn{font-size:20px;font-weight:700;color:var(--text)}
.sd-header .ver{font-size:11px;color:var(--dim);font-family:var(--mono);background:var(--surface-2);padding:3px 8px;border-radius:10px}
.sd-header .idline{font-size:12px;color:var(--faint);font-family:var(--mono);margin-bottom:12px}
.sd-header .idline span{margin-right:12px}
.sd-header .tags{display:flex;gap:8px;flex-wrap:wrap}
.sd-tag{font-size:11px;padding:4px 10px;border-radius:20px;background:var(--surface-2);color:var(--dim);border:1px solid var(--border);display:flex;align-items:center;gap:5px}
.sd-tag.hot{background:rgba(251,191,36,.12);color:var(--amber);border-color:rgba(251,191,36,.3)}
.sd-tag.local{background:rgba(34,211,238,.10);color:var(--cyan);border-color:rgba(34,211,238,.25)}
.sd-body{flex:1;overflow-y:auto;padding:22px 24px}
.sd-section{margin-bottom:22px}
.sd-section-title{font-size:13px;font-weight:650;color:var(--text);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sd-section-title::before{content:'';width:3px;height:14px;background:var(--cyan);border-radius:2px}
.sd-desc{font-size:13px;color:var(--dim);line-height:1.8}
.sd-res{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);font-size:13px}
.sd-res:last-child{border-bottom:none}
.sd-res .ico{width:28px;height:28px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-size:14px;flex-shrink:0}
.sd-res .lab{flex:1;color:var(--dim)}
.sd-res .val{font-weight:600;color:var(--text);font-family:var(--mono)}
.sd-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px}
.sd-footer button{flex:1;padding:9px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:12.5px;cursor:pointer;transition:.15s}
.sd-footer button:hover{border-color:var(--border-hover);background:var(--surface-3)}
.sd-footer .primary{background:var(--cyan);border-color:var(--cyan);color:#04121a;font-weight:650}
.sd-footer .primary:hover{filter:brightness(1.08);background:var(--cyan)}
.sd-footer .danger{background:rgba(248,113,113,.10);border-color:rgba(248,113,113,.3);color:var(--red)}
.sd-footer .danger:hover{background:rgba(248,113,113,.18)}

/* Skill工坊统计（概览页） */
.dash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
@media(max-width:1100px){.dash-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.dash-grid{grid-template-columns:1fr}}
.dash-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;position:relative;overflow:hidden}
.dash-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cyan)}
.dc-label{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.dc-val{font-size:26px;font-weight:700;color:var(--text);font-family:var(--mono)}
.dc-sub{font-size:11px;color:var(--dim);margin-top:4px}
.ds-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:900px){.ds-row{grid-template-columns:1fr}}
.dash-section{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px}
.ds-title{font-size:13px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.ds-bar-row{display:flex;align-items:center;gap:10px;font-size:12.5px;margin-bottom:12px}
.ds-bar-label{width:90px;flex-shrink:0;color:var(--dim);font-weight:500}
.ds-bar-track{flex:1;height:10px;background:var(--surface-3);border-radius:5px;overflow:hidden}
.ds-bar-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--cyan),var(--blue))}
.ds-bar-count{width:40px;text-align:right;color:var(--dim);font-size:11px;font-family:var(--mono)}
.heat-list{list-style:none;padding:0;margin:0}
.heat-item{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)}
.heat-item:last-child{border-bottom:none}
.heat-rank{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;flex-shrink:0}
.r1{background:linear-gradient(135deg,#ffd700,#ffaa00);color:#000}
.r2{background:linear-gradient(135deg,#c0c0c0,#999);color:#000}
.r3{background:linear-gradient(135deg,#cd7f32,#a0522d);color:#fff}
.rx{background:var(--surface-3);color:var(--dim)}
.heat-name{flex:1;font-weight:500;font-size:13px;cursor:pointer}
.heat-name:hover{color:var(--cyan)}
.heat-val{font-size:11px;color:var(--dim);font-family:var(--mono)}
.src-row{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:8px}
.src-row label{width:90px;flex-shrink:0;color:var(--dim)}
.src-track{flex:1;height:10px;background:var(--surface-3);border-radius:5px;overflow:hidden}
.src-fill{height:100%;border-radius:5px}
.src-pct{width:36px;text-align:right;font-size:11px;color:var(--dim);font-family:var(--mono)}
.ds-scroll{max-height:260px;overflow-y:auto;padding-right:4px}

/* 视图切换 + 翻页 */
.view-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.view-bar .res{margin-left:auto;font-size:12px;color:var(--dim)}
.view-toggle{display:inline-flex;border:1px solid var(--border);border-radius:20px;overflow:hidden;background:var(--surface)}
.vt-btn{padding:6px 15px;font-size:12.5px;color:var(--dim);background:transparent;border:none;cursor:pointer;transition:.15s}
.vt-btn:hover{color:var(--text)}
.vt-btn.active{background:var(--cyan);color:#04121a;font-weight:600}
.pagination{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:18px}
.pagination button{padding:6px 15px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);cursor:pointer;font-size:12.5px;transition:.15s}
.pagination button:hover:not(:disabled){border-color:var(--border-hover)}
.pagination button:disabled{opacity:.35;cursor:not-allowed}
.page-info{font-size:12px;color:var(--dim);font-family:var(--mono)}

/* 分类筛选 */
.shelf-nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.nav-pill{padding:6px 13px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--dim);font-size:12.5px;cursor:pointer;transition:.15s;user-select:none}
.nav-pill:hover{border-color:var(--border-hover);color:var(--text)}
.nav-pill.active{background:rgba(34,211,238,.14);border-color:rgba(34,211,238,.3);color:var(--cyan)}
.nav-pill b{font-family:var(--mono);opacity:.8;margin-left:3px}

/* 零件卡片 */
.shelf-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(224px,1fr));gap:12px}
.part-card{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:14px 16px;transition:.16s;cursor:pointer}
.part-card:hover{border-color:var(--border-hover);transform:translateY(-2px)}
.part-name{font-size:13.5px;font-weight:550;margin-bottom:6px}
.part-desc{font-size:11.5px;color:var(--dim);line-height:1.5;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.part-foot{display:flex;align-items:center;gap:8px;font-size:11px}
.use-tag{color:var(--cyan);font-family:var(--mono)}
.chip{font-size:10.5px;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--dim);font-family:var(--mono);white-space:nowrap}
.dept{margin-bottom:22px}
.dept-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.dept-head h2{font-size:14px;font-weight:600}
.dept-head .cnt{font-size:11px;color:var(--dim);font-family:var(--mono)}

/* 全局悬停提示 */
#global-tooltip{position:fixed;z-index:100;max-width:320px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.4);font-size:12px;color:var(--dim);line-height:1.5;pointer-events:none;opacity:0;transition:opacity .12s;transform:translate(-50%,-100%);margin-top:-8px}
#global-tooltip.show{opacity:1}
#global-tooltip .tt-title{font-weight:600;color:var(--text);margin-bottom:4px;font-size:13px}
#global-tooltip .tt-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
#global-tooltip .tt-row .chip{font-size:10px}

/* 列表视图 */
.lt-name{font-weight:550}
.lt-desc{color:var(--dim);font-size:12px;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lt-tag{font-size:10.5px;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--dim);margin-right:4px;white-space:nowrap;font-family:var(--mono)}
.lt-tag.g{color:var(--green)}
.lt-tag.y{color:var(--amber)}

/* Skill 目录卡片 */
.sk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:13px}
.sk-card{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:15px 16px;transition:.16s}
.sk-card:hover{border-color:var(--border-hover);transform:translateY(-2px)}
.sk-name{font-size:14px;font-weight:600;margin-bottom:7px}
.sk-desc{font-size:11.5px;color:var(--dim);line-height:1.5;margin-bottom:11px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sk-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px}
.sk-acts{display:flex;gap:7px}
.btn{padding:5px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:11.5px;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--border-hover)}
.btn.active{background:rgba(34,211,238,.16);border-color:rgba(34,211,238,.4);color:var(--cyan);font-weight:600}
.btn.go{background:rgba(34,211,238,.14);border-color:rgba(34,211,238,.3);color:var(--cyan)}

/* 生成记录 / 拆解任务 */
.gen-card{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:15px 18px;margin-bottom:12px;cursor:pointer;transition:.15s}
.gen-card:hover{border-color:var(--border-hover)}
.gen-head{display:flex;align-items:center;gap:11px}
.gen-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.gen-head h3{font-size:14px;font-weight:600}
.gen-meta{margin-left:auto;display:flex;gap:12px;font-size:11px;color:var(--dim);font-family:var(--mono)}
.gen-body{margin-top:12px;display:none}
.gen-card.open .gen-body{display:block}
.gen-timeline{display:flex;flex-direction:column;gap:7px;font-size:12.5px;color:var(--dim)}
.gen-basis{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.gen-basis-title{font-size:11px;color:var(--dim);margin-bottom:8px}
.gen-basis-row{display:flex;flex-wrap:wrap;gap:7px}
.gen-basis-row a{font-size:11.5px;color:var(--cyan);cursor:pointer;text-decoration:none}
.dsm-card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:14px 18px;margin-bottom:10px}

#toast{position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--surface-3);border:1px solid var(--border-hover);padding:12px 22px;border-radius:11px;font-size:13px;opacity:0;transition:.3s;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;padding-top:80px;z-index:60}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:min(460px,92vw);max-height:calc(100vh - 120px);overflow-y:auto;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal h3{font-size:16px;font-weight:650;margin-bottom:10px;display:flex;align-items:center;gap:9px}
.modal .body{font-size:13px;color:var(--dim);line-height:1.7;margin-bottom:18px}
.modal .body code{background:var(--surface-2);padding:2px 7px;border-radius:5px;color:var(--cyan);font-family:var(--mono);font-size:12px}
.modal .body .warn{background:rgba(248,113,113,.10);border-left:3px solid var(--red);padding:10px 12px;border-radius:8px;color:var(--text);margin-top:10px}
.modal .acts{display:flex;justify-content:flex-end;gap:10px}
.modal .acts button{padding:8px 16px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:12.5px;cursor:pointer;transition:.15s}
.modal .acts button:hover{border-color:var(--border-hover)}
.modal .acts .danger{background:rgba(248,113,113,.14);border-color:rgba(248,113,113,.35);color:var(--red)}
.modal .acts .danger:hover{background:rgba(248,113,113,.22)}
.modal .acts .primary{background:var(--cyan);border-color:var(--cyan);color:#04121a;font-weight:650}
.modal .acts .primary:hover{filter:brightness(1.08)}
.sess-tree{max-height:300px;overflow-y:auto;margin:12px 0;border:1px solid var(--border);border-radius:10px;padding:8px 10px;background:var(--surface-2)}
.sess-proj{padding:8px 4px 4px;font-size:13px}
.sess-proj .dim{color:var(--faint);font-size:11px;font-weight:400}
.sess-row{display:flex;align-items:center;gap:8px;padding:6px 4px;border-top:1px solid var(--border);font-size:12.5px;cursor:pointer}
.sess-row .sr-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess-row .dim{color:var(--faint);font-size:11px;font-family:var(--mono)}
.sess-actions{display:flex;gap:10px;margin-top:12px;justify-content:flex-end}
.sum-item{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:10px;background:var(--surface-2)}
.sum-item .sum-h{font-weight:600;font-size:13px;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.sum-item .sum-body{font-size:12px;color:var(--dim);white-space:pre-wrap;line-height:1.6;max-height:200px;overflow-y:auto}

/* ── Agent：对话 / 任务 / 异常 / 设置 ── */
.tag.g{background:rgba(52,211,153,.15);color:var(--green)}
.tag.y{background:rgba(251,191,36,.15);color:var(--amber)}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--surface);margin-bottom:8px;transition:.15s;cursor:pointer}
.list-row:hover{border-color:var(--border-hover);background:var(--surface-2)}
.list-row.active{border-color:var(--cyan);background:linear-gradient(90deg,rgba(34,211,238,.10),transparent);box-shadow:0 0 0 1px rgba(34,211,238,.15)}
.lr-main{flex:1;min-width:0}
.lr-title{font-size:13px;font-weight:600}
.lr-sub{font-size:11px;color:var(--dim);margin-top:2px}
.lr-tag{font-size:10px;padding:2px 9px;border-radius:20px;background:var(--surface-2);color:var(--dim);flex-shrink:0;font-family:var(--mono)}
/* ── 对话页（铺满 + 双标签）── */
.chat-page{height:100%;display:flex;flex-direction:column;gap:14px}
.chat-tabs{display:flex;gap:8px;border-bottom:1px solid var(--border);padding-bottom:10px;flex-shrink:0}
.chat-tab{padding:7px 14px;border-radius:20px;font-size:13px;color:var(--dim);cursor:pointer;border:1px solid transparent;transition:.15s}
.chat-tab:hover{color:var(--text);background:var(--surface-2)}
.chat-tab.active{background:var(--cyan);color:#04121a;border-color:var(--cyan);font-weight:650}
.chat-wrap{flex:1;min-height:0;display:grid;grid-template-columns:300px 1fr;gap:16px}
.chat-sidebar{border:1px solid var(--border);border-radius:14px;background:var(--surface);display:flex;flex-direction:column;overflow:hidden}
.chat-sidebar-head{padding:12px 14px;border-bottom:1px solid var(--border);font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px}
.chat-search-box{padding:10px 14px;border-bottom:1px solid var(--border);position:relative}
.chat-search-box input{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:9px 12px 9px 32px;color:var(--text);font-size:13px;outline:none;transition:.16s}
.chat-search-box input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.1)}
.chat-search-box .si{position:absolute;left:23px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:13px;pointer-events:none}
.chat-tree{flex:1;overflow-y:auto;padding:10px}
.conv-tree-project{margin-bottom:12px}
.conv-proj-name{font-size:11.5px;font-weight:600;color:var(--dim);margin-bottom:6px;padding-left:4px;text-transform:uppercase;letter-spacing:.5px}
.conv-tree-session{padding:8px 10px;border-radius:9px;cursor:pointer;margin-bottom:4px;font-size:12.5px;color:var(--text);border:1px solid transparent;transition:.12s}
.conv-tree-session:hover{background:var(--surface-2)}
.conv-tree-session.active{background:rgba(34,211,238,.12);border-color:rgba(34,211,238,.3)}
.conv-tree-session .s-title{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-tree-session .s-meta{font-size:11px;color:var(--dim);margin-top:2px}
.chat-main{border:1px solid var(--border);border-radius:14px;background:var(--surface);display:flex;flex-direction:column;overflow:hidden}
.chat-main-empty{flex:1;display:grid;place-items:center;color:var(--dim);font-size:13px;text-align:center;padding:20px}
.chat-main-head{padding:12px 16px;border-bottom:1px solid var(--border)}
.chat-main-title{font-weight:600;font-size:13px}
.chat-main-sub{font-size:11px;color:var(--dim);margin-top:2px}
.chat-msg-list{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.chat-msg{max-width:85%;padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.6;word-break:break-word}
.chat-msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--cyan),var(--purple));color:#fff;border-bottom-right-radius:4px}
.chat-msg.assistant{align-self:flex-start;background:var(--surface-2);border:1px solid var(--border);color:var(--text)}
.chat-msg.reasoning{align-self:flex-start;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.25);color:var(--amber);font-size:12px}
.chat-msg-role{font-size:10px;opacity:.8;margin-bottom:3px}
.chat-msg-time{font-size:10px;opacity:.65;margin-top:4px;text-align:right}
.conv-list{overflow-y:auto;padding-right:4px}
.chat-box{border:1px solid var(--border);border-radius:14px;background:var(--surface);display:flex;flex-direction:column;overflow:hidden}
.chat-bar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border)}
.chat-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:80%;padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.6;word-break:break-word}
.msg.you{align-self:flex-end;background:linear-gradient(135deg,var(--cyan),var(--purple));color:#fff;border-bottom-right-radius:4px}
.msg.boss{align-self:flex-start;background:var(--surface-2);border:1px solid var(--border);color:var(--text)}
.chat-in{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border);align-items:flex-end}
.chat-in textarea{flex:1;padding:10px 14px;border-radius:16px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:13px;outline:none;resize:none;min-height:78px;line-height:1.5;font-family:inherit}
.skill-pick{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--border);max-height:110px;overflow-y:auto}
.skill-pick .sp{padding:4px 10px;border-radius:14px;font-size:11px;border:1px solid var(--border);cursor:pointer;color:var(--dim);transition:.15s}
.skill-pick .sp.active{background:var(--cyan);color:#04121a;border-color:var(--cyan);font-weight:650}
.skill-pick .sp:hover{color:var(--text);border-color:var(--border-hover)}
.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
@media(max-width:900px){.settings-grid{grid-template-columns:1fr}}
.setting-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px}
.setting-card.full{grid-column:1/-1}
.setting-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.setting-ico{font-size:18px;line-height:1}
.setting-title{font-size:14px;font-weight:600;color:var(--text)}
.setting-desc{font-size:11.5px;color:var(--dim);margin-top:-10px;margin-bottom:14px;line-height:1.5}
.setting-row{display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:center;margin-bottom:10px}
@media(max-width:560px){.setting-row{grid-template-columns:1fr}}
.setting-row label{font-size:12px;color:var(--dim);font-weight:500}
.setting-row input,.setting-row select{width:100%;padding:8px 12px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:13px;outline:none}
.setting-row input:focus{border-color:var(--cyan)}
.setting-row input[readonly]{opacity:.75;cursor:not-allowed}
.theme-options{display:flex;gap:10px}
.theme-option{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);color:var(--dim);font-size:13px;cursor:pointer;transition:.15s}
.theme-option:hover{border-color:var(--border-hover);color:var(--text)}
.theme-option.active{border-color:var(--cyan);background:rgba(34,211,238,.10);color:var(--cyan)}
.settings-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--border)}
.hint{font-size:11px;color:var(--dim);margin-top:10px;line-height:1.6}
@media(max-width:900px){.chat-wrap{grid-template-columns:1fr}.conv-list{max-height:220px}}

/* ── Table actions / layout helpers ── */
.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
@media(max-width:1100px){.three-col{grid-template-columns:1fr}}
.act-bar{display:flex;gap:6px;flex-wrap:nowrap}
.btn.danger{background:rgba(248,113,113,.10);border-color:rgba(248,113,113,.25);color:var(--red)}
.btn.danger:hover{background:rgba(248,113,113,.18);border-color:rgba(248,113,113,.4)}
.btn.up{background:rgba(52,211,153,.10);border-color:rgba(52,211,153,.25);color:var(--green)}
.btn.up:hover{background:rgba(52,211,153,.18)}
.sc-actions{display:flex;gap:7px;margin-top:12px;align-items:center}
.sc-actions button{font-size:11px;padding:5px 11px;border-radius:7px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);cursor:pointer;transition:.15s}
.sc-actions button:hover{border-color:var(--border-hover)}
.sc-actions .clean{background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.3);color:var(--green)}
.sc-actions .clean:hover{background:rgba(52,211,153,.2)}
.sc-actions .clean.warn{background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.3);color:var(--amber)}
.sc-actions .clean.warn:hover{background:rgba(251,191,36,.2)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:var(--border-hover)}
::-webkit-scrollbar-track{background:transparent}

/* ── 搜索结果 ── */
.search-result{border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:14px 16px;margin-bottom:10px}
.sr-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.sr-title{font-weight:600;font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-time{font-size:11px;color:var(--faint);font-family:var(--mono)}
.sr-score{font-size:11px;color:var(--cyan);font-family:var(--mono);background:var(--surface-2);padding:2px 8px;border-radius:10px}
.sr-snippet{font-size:12.5px;color:var(--dim);line-height:1.7}
.sr-code{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px;margin-top:10px;overflow-x:auto;font-size:11.5px}

/* ── 一屏大盘概览（Agent 全景驾驶舱）── */
@import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Sora:wght@300;400;600&display=swap');
.dash-proto{--dp-display:'Chakra Petch',sans-serif;--dp-body:'Sora',sans-serif;height:calc(100vh - var(--header-h) - 24px);display:flex;flex-direction:column;gap:10px;overflow:hidden;font-family:var(--dp-body)}
.dash-proto .dp-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;backdrop-filter:blur(12px);box-shadow:0 14px 34px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.04);transition:.2s ease;display:flex;flex-direction:column;min-width:0}
.dash-proto .dp-card:hover{border-color:var(--border-hover);box-shadow:0 18px 44px rgba(0,0,0,.22)}
.dash-proto .dp-card-head{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:9px 12px 0;font-family:var(--dp-display);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.dash-proto .dp-card-head .right{margin-left:auto;font-family:var(--dp-body);font-size:9px;letter-spacing:0;text-transform:none;background:var(--surface-2);padding:2px 6px;border-radius:5px}
.dash-proto .dp-card-body{flex:1;padding:7px 12px 11px;display:flex;flex-direction:column;justify-content:center;min-height:0;overflow:hidden}

.dash-proto .dp-kpi-row{flex:0 0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.dash-proto .dp-kpi{padding:9px;position:relative;overflow:hidden;cursor:default}
.dash-proto .dp-kpi::before{content:'';position:absolute;inset:0;border-radius:14px;padding:1px;background:linear-gradient(135deg,rgba(34,211,238,.3),transparent 45%,transparent 55%,rgba(255,255,255,.08));-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.dash-proto .dp-kpi .ico{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:13px;background:rgba(255,255,255,.05);margin-bottom:5px}
.dash-proto .dp-kpi.c-cyan .ico{background:rgba(34,211,238,.14);color:var(--cyan)}
.dash-proto .dp-kpi.c-purple .ico{background:rgba(167,139,250,.14);color:var(--purple)}
.dash-proto .dp-kpi.c-amber .ico{background:rgba(251,191,36,.14);color:var(--amber)}
.dash-proto .dp-kpi.c-green .ico{background:rgba(52,211,153,.14);color:var(--green)}
.dash-proto .dp-kpi.c-blue .ico{background:rgba(96,165,250,.14);color:var(--blue)}
.dash-proto .dp-kpi.c-red .ico{background:rgba(248,113,113,.14);color:var(--red)}
.dash-proto .dp-kpi .val{font-family:var(--dp-display);font-size:18px;font-weight:700;letter-spacing:-.5px}
.dash-proto .dp-kpi .lab{font-size:9px;color:var(--dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dash-proto .dp-kpi .sub{font-size:8px;color:var(--dim);margin-top:1px;font-family:var(--dp-display);opacity:.75}

.dash-proto .dp-main{flex:1 1 0;display:grid;grid-template-columns:230px 1fr 230px;gap:10px;min-height:0}
.dash-proto .dp-col{display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0}
.dash-proto .dp-col .dp-card{flex:1 1 0}

.dash-proto .dp-donut-wrap{display:flex;align-items:center;gap:9px}
.dash-proto .dp-donut{position:relative;width:74px;height:74px;border-radius:50%;flex-shrink:0;box-shadow:0 0 14px rgba(34,211,238,.12)}
.dash-proto .dp-donut::after{content:'';position:absolute;inset:18px;border-radius:50%;background:var(--surface);border:1px solid var(--border)}
.dash-proto .dp-donut .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.dash-proto .dp-donut .center .big{font-family:var(--dp-display);font-size:15px;font-weight:700;line-height:1;margin:0;padding:0}
.dash-proto .dp-donut .center .small{font-size:7px;color:var(--dim);letter-spacing:.8px;line-height:1;margin-top:2px}
.dash-proto .dp-legend{flex:1;display:flex;flex-direction:column;gap:4px}
.dash-proto .dp-legend .row{display:flex;align-items:center;gap:5px;font-size:9px;white-space:nowrap}
.dash-proto .dp-legend .dot{width:6px;height:6px;border-radius:2px}
.dash-proto .dp-legend .nm{color:var(--dim);flex:1;overflow:hidden;text-overflow:ellipsis}
.dash-proto .dp-legend .vl{font-family:var(--dp-display)}

.dash-proto .dp-bar-row{display:flex;align-items:center;gap:7px;font-size:9px;margin-bottom:5px;white-space:nowrap;cursor:default}
.dash-proto .dp-bar-row:last-child{margin-bottom:0}
.dash-proto .dp-bar-row .nm{width:54px;color:var(--dim);overflow:hidden;text-overflow:ellipsis}
.dash-proto .dp-bar-row .track{flex:1;height:5px;background:var(--surface-3);border-radius:3px;overflow:hidden;min-width:36px}
.dash-proto .dp-bar-row .fill{height:100%;border-radius:3px;box-shadow:0 0 5px currentColor}
.dash-proto .dp-bar-row .vl{width:28px;text-align:right;font-family:var(--dp-display);font-size:9px}

.dash-proto .dp-arena-wrap{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}
.dash-proto .dp-arena{position:relative;flex:1 1 0;border-radius:18px;overflow:visible;min-height:0;background:radial-gradient(ellipse at 50% 100%,rgba(34,211,238,.13) 0%,transparent 55%),radial-gradient(ellipse at 20% 20%,rgba(167,139,250,.09) 0%,transparent 45%),radial-gradient(ellipse at 80% 30%,rgba(52,211,153,.06) 0%,transparent 40%),linear-gradient(180deg,rgba(34,211,238,.03),rgba(167,139,250,.03)),var(--surface)}
.dash-proto .dp-arena .wb-avatar{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:100%;max-width:100%;width:auto;object-fit:contain;z-index:1;pointer-events:none;filter:drop-shadow(0 0 36px rgba(34,211,238,.3)) drop-shadow(0 0 70px rgba(167,139,250,.14))}

.dash-proto .dp-alert-item{display:flex;gap:6px;align-items:flex-start;padding:7px;border-radius:8px;background:rgba(255,255,255,.04);margin-bottom:5px;font-size:9.5px;border-left:2px solid transparent;cursor:default;transition:.2s}
.dash-proto .dp-alert-item:last-child{margin-bottom:0}
.dash-proto .dp-alert-item:hover{background:rgba(255,255,255,.08)}
.dash-proto .dp-alert-item .ico{font-size:12px;flex-shrink:0;margin-top:1px}
.dash-proto .dp-alert-item .txt{line-height:1.45}
.dash-proto .dp-alert-item .txt b{color:var(--text);font-weight:600}
.dash-proto .dp-alert-item.danger{border-left-color:var(--red)}
.dash-proto .dp-alert-item.warn{border-left-color:var(--amber)}
.dash-proto .dp-alert-item.info{border-left-color:var(--cyan)}

.dash-proto .dp-bottom{flex:0 0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:10px;min-height:88px;height:auto}
.dash-proto .dp-mini{position:relative;padding:10px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:default;overflow:hidden}
.dash-proto .dp-mini::before{content:'';position:absolute;top:0;left:0;right:0;height:2.5px;background:linear-gradient(90deg,var(--cyan),var(--purple));opacity:.9}
.dash-proto .dp-mini .mk-ico{font-size:22px;margin-bottom:4px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.dash-proto .dp-mini .mk-lab{font-size:9px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;font-family:var(--dp-display)}
.dash-proto .dp-mini .mk-val{font-family:var(--dp-display);font-size:18px;font-weight:700;margin:2px 0 2px;background:linear-gradient(135deg,var(--text) 30%,var(--cyan) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.dash-proto .dp-mini .mk-sub{font-size:9px;color:var(--dim)}
.dash-proto .dp-rec{grid-column:span 2;text-align:left;padding:0;overflow:hidden;position:relative}
.dash-proto .dp-rec::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--green),var(--cyan));opacity:.9}
.dash-proto .dp-rec .dp-card-head{padding:5px 12px 3px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.02)}
.dash-proto .dp-rec-list{padding:4px 12px 4px}
.dash-proto .dp-rec-item{display:flex;align-items:center;gap:8px;font-size:9px;padding:3.5px 0;border-bottom:1px solid rgba(255,255,255,.05);cursor:default;transition:.2s}
.dash-proto .dp-rec-item:last-child{border-bottom:none}
.dash-proto .dp-rec-item:hover{background:rgba(255,255,255,.05);border-radius:6px;margin:0 -4px;padding-left:4px;padding-right:4px}
.dash-proto .dp-rec-item .ico{width:17px;height:17px;border-radius:50%;display:grid;place-items:center;font-size:9px;background:rgba(255,255,255,.07);flex-shrink:0;box-shadow:0 0 0 1px rgba(255,255,255,.05)}
.dash-proto .dp-rec-item .txt{flex:1;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.dash-proto .dp-rec-item .txt b{color:var(--text);font-weight:600}
.dash-proto .dp-rec-item .btn{margin-left:auto;padding:2px 7px;border-radius:6px;border:1px solid var(--border);background:rgba(255,255,255,.06);color:var(--text);font-size:8px;font-family:var(--dp-display);text-transform:uppercase;letter-spacing:.4px;cursor:pointer;transition:.2s;white-space:nowrap;flex-shrink:0}
.dash-proto .dp-rec-item .btn:hover{border-color:var(--cyan);color:var(--cyan);background:rgba(34,211,238,.08)}
.dash-proto .dp-rec-item .btn.primary{background:var(--cyan);border-color:var(--cyan);color:#001015;font-weight:700}
.dash-proto .dp-rec-item .btn.primary:hover{background:#5eeaff;color:#001015}
.dash-proto .dp-rec-item .btn.warn{background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.3);color:var(--amber)}
.dash-proto .dp-rec-item .btn.warn:hover{background:rgba(251,191,36,.2);color:#ffd36b}

.dash-proto .capsule{position:absolute;transform:translate(-50%,-50%);border-radius:999px;padding:5px 11px;font-size:10px;font-weight:600;background:rgba(6,10,16,.72);border:1px solid;backdrop-filter:blur(6px);box-shadow:0 6px 16px rgba(0,0,0,.35);white-space:nowrap;z-index:0;animation:capFloat 5s ease-in-out infinite;font-family:var(--dp-body);cursor:pointer;transition:.2s}
.dash-proto .capsule:hover{transform:translate(-50%,-55%) scale(1.06);z-index:1;background:rgba(6,10,16,.92)}
.dash-proto .capsule small{opacity:.7;font-weight:400;font-size:9px;margin-left:3px;font-family:var(--dp-display)}
@keyframes capFloat{0%,100%{translate:0 0}50%{translate:0 -6px}}

#dp-tooltip{position:fixed;z-index:1000;max-width:240px;padding:8px 10px;border-radius:8px;background:rgba(8,13,22,.95);border:1px solid rgba(34,211,238,.25);color:var(--text);font-size:11px;line-height:1.5;box-shadow:0 10px 30px rgba(0,0,0,.5);backdrop-filter:blur(8px);pointer-events:none;opacity:0;transition:opacity .15s;white-space:normal}
#dp-tooltip.visible{opacity:1}
#dp-tooltip b{display:block;font-weight:600;margin-bottom:2px;color:var(--cyan)}
#dp-modal-overlay{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px}
#dp-modal-overlay.active{display:flex}
#dp-modal{width:360px;max-width:100%;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:0 30px 80px rgba(0,0,0,.6);position:relative}
#dp-modal .close{position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:50%;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--dim);cursor:pointer;display:grid;place-items:center;font-size:14px;transition:.2s}
#dp-modal .close:hover{border-color:var(--cyan);color:var(--cyan)}
#dp-modal h3{font-family:var(--dp-display);font-size:16px;margin-bottom:4px}
#dp-modal .meta{font-size:10px;color:var(--dim);margin-bottom:12px}
#dp-modal .row{display:flex;justify-content:space-between;font-size:11px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06)}
#dp-modal .row:last-child{border-bottom:none}
#dp-modal .row span{color:var(--dim)}
#dp-modal .row strong{font-family:var(--dp-display);font-weight:600}
#dp-modal .desc{font-size:11px;color:var(--dim);line-height:1.6;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08)}

@media(max-width:1200px){
  .dash-proto .dp-main{grid-template-columns:200px 1fr 200px}
  .dash-proto .dp-kpi-row{grid-template-columns:repeat(3,1fr)}
  .dash-proto .dp-bottom{grid-template-columns:repeat(3,1fr);height:auto}
  .dash-proto .dp-rec{grid-column:span 1}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <button class="sidebar-toggle" id="sidebar-toggle" title="收起/展开侧边栏" aria-label="toggle sidebar">◀</button>
    <div class="brand">
      <div class="logo">🛠️</div>
      <div><div class="t1">WorkBuddy 控制台</div><div class="t2">CONSOLE</div></div>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-label">总览</div>
      <div class="nav-item active" data-tab="overview"><span class="ico">📊</span><span class="txt">概览</span><span class="badge" id="b-overview"></span></div>
      <div class="nav-label">资产管理</div>
      <div class="nav-item" data-tab="skills"><span class="ico">🧩</span><span class="txt">Skill 管理</span><span class="badge" id="b-skills"></span></div>
      <div class="nav-item" data-tab="storage"><span class="ico">💾</span><span class="txt">存储空间</span><span class="badge" id="b-storage"></span></div>
      <div class="nav-label">Skill工坊</div>
      <div class="nav-item" data-tab="shelf"><span class="ico">📦</span><span class="txt">模板库</span><span class="badge" id="b-shelf"></span></div>
      <div class="nav-item" data-tab="gens"><span class="ico">📜</span><span class="txt">Skill生成记录</span><span class="badge" id="b-gens"></span></div>
      <div class="nav-item" data-tab="dismantle"><span class="ico">🛠️</span><span class="txt">任务拆解</span><span class="badge" id="b-dismantle"></span></div>
      <div class="nav-label">Agent</div>
      <div class="nav-item" data-tab="chat"><span class="ico">💬</span><span class="txt">对话</span><span class="badge" id="b-chat"></span></div>
      <div class="nav-item" data-tab="tasks"><span class="ico">📋</span><span class="txt">任务</span><span class="badge" id="b-tasks"></span></div>

    <div class="side-foot">
      <span><span class="dot"></span>本地数据</span>
      <span id="gen-time">—</span>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="tab-title">概览</h1>
        <div class="sub" id="tab-sub">Agent 资产全景 · 一键洞察</div>
      </div>
      <div class="backend-status" id="backend-status" title="控制台后端连接状态">● 检测中…</div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>
<div id="toast"></div>
<div id="global-tooltip"></div>
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3 id="m-title">⚠️ 确认操作</h3>
    <div class="body" id="m-body"></div>
    <div class="acts">
      <button onclick="closeModal()">取消</button>
      <button id="m-confirm" class="primary">确认</button>
    </div>
  </div>
</div>

<script>
const TAB_META = {
  overview:  {title:'概览',        sub:'Agent 资产全景 · Skill 体量可视化 · 一键洞察'},
  skills:    {title:'Skill 管理',  sub:'已装 Skill 健康度 · 升级 · 删除 · 使用频率'},
  storage:   {title:'存储空间',    sub:'日志 / 会话 / 缓存 占用明细与清理建议'},
  shelf:     {title:'模板库',      sub:'模板货架 · Skill 体量解剖 · 双视图翻页'},
  gens:      {title:'Skill生成记录', sub:'Skill 自动组装的产出与选用零件'},
  dismantle: {title:'任务拆解',    sub:'Skill 自动拆解回填进度'},
  chat:      {title:'对话',        sub:'与 Skill 对话 · 查看并检索 WorkBuddy 历史会话'},
  tasks:     {title:'任务',        sub:'自动化任务列表与运行状态'},
  anomalies: {title:'异常日志',    sub:'运行异常与错误采样'},

function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function sizeH(b){const u=['B','KB','MB','GB'];let n=b;for(const x of u){if(n<1024)return n.toFixed(1)+' '+x;n/=1024;}return n.toFixed(1)+' TB';}
function fmtNum(n){return (n||0).toLocaleString();}
function heatColor(h){if(h>0.66)return '#f87171';if(h>0.4)return '#fbbf24';if(h>0.18)return '#22d3ee';return '#48566a';}

// ── 后端地址 ── 优先跟随当前页面 origin，否则默认 localhost:8080；可在设置页覆盖
function getApiBase(){
  try{
    const cfg = JSON.parse(localStorage.getItem('wb_console_api_base') || '{}');
    if(cfg.base_url) return cfg.base_url.replace(/\/$/,'');
  }catch(e){}
  if(location.protocol.startsWith('http')) return location.origin;
  return 'http://127.0.0.1:8080';
}
function apiUrl(path){ return getApiBase() + path; }
function apiErrorHint(e){
  const msg=(e&&e.message)?e.message:String(e);
  const base=getApiBase();
  if(/failed to fetch|networkerror|无法连接|net::err/i.test(msg)){
    return '无法连接控制台后端 '+base+'。<br>请确认已运行 <code style="background:var(--surface-2);padding:2px 6px;border-radius:4px">python server.py</code>，或通过「设置」修改后端地址。';
  }
  return esc(msg);
}
function apiPost(path,body){
  return fetch(apiUrl(path),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json());
}

// ── 全局悬停提示 ──
function initTooltip(){
  const tt=document.getElementById('global-tooltip'); if(!tt)return;
  document.body.addEventListener('mouseover',e=>{
    const el=e.target.closest('[data-tooltip]'); if(!el)return;
    const data=el.dataset.tooltip; if(!data)return;
    let html='';
    try{
      const obj=JSON.parse(data);
      html='<div class="tt-title">'+esc(obj.title||'')+'</div>'+esc(obj.desc||'');
      if(obj.tags&&obj.tags.length) html+='<div class="tt-row">'+obj.tags.map(t=>'<span class="chip">'+esc(t)+'</span>').join('')+'</div>';
    }catch(err){ html=esc(data); }
    tt.innerHTML=html; tt.classList.add('show');
    positionTooltip(el,tt);
  });
  document.body.addEventListener('mouseout',e=>{
    if(e.target.closest('[data-tooltip]')) tt.classList.remove('show');
  });
  document.body.addEventListener('mousemove',e=>{
    const el=e.target.closest('[data-tooltip]'); if(!el)return; positionTooltip(el,tt);
  });
}
function positionTooltip(el,tt){
  const r=el.getBoundingClientRect(), tr=tt.getBoundingClientRect();
  let top=r.top-8, left=r.left+r.width/2;
  if(top<tr.height+8) top=r.bottom+tr.height+12;
  if(left<tr.width/2+8) left=tr.width/2+8;
  if(left+tr.width/2>window.innerWidth-8) left=window.innerWidth-tr.width/2-8;
  tt.style.top=top+'px'; tt.style.left=left+'px';
}

// ── Donut ──
function donut(segs){
  const R=54, C=2*Math.PI*R, total=segs.reduce((a,s)=>a+s.v,0)||1;
  let off=0, arcs='';
  segs.forEach(s=>{
    const len=s.v/total*C;
    arcs+=`<circle cx="69" cy="69" r="${R}" fill="none" stroke="${s.c}" stroke-width="13" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 69 69)"/>`;
    off+=len;
  });
  return `<svg class="donut" viewBox="0 0 138 138">${arcs}</svg>`;
}

function dpDonut(segs){
  const total=segs.reduce((a,s)=>a+s.v,0)||1;
  let acc=0, stops=[];
  segs.forEach(s=>{const p=s.v/total;stops.push(`${s.c} ${acc*360}deg ${(acc+p)*360}deg`);acc+=p;});
  return `<div class="dp-donut" style="background:conic-gradient(${stops.join(',')})"><div class="center"><div class="big">${dpHealth()}</div><div class="small">HEALTH</div></div></div>`;
}
function dpHealth(){
  const cnt={safe:0,warn:0,danger:0,neutral:0};
  DATA.skills.forEach(s=>cnt[s.status_color=(s.status_color||'neutral')]++);
  const n=DATA.skills.length||1;
  return Math.round((cnt.safe*100+cnt.warn*70+cnt.neutral*80+cnt.danger*30)/n);
}
function dpBar(nm,v,max,c,tip){

  return `<div class="dp-bar-row" data-tip="${esc(tip)}"><div class="nm">${esc(nm)}</div><div class="track"><div class="fill" style="width:${pct}%;background:${c};color:${c}"></div></div><div class="vl">${v}</div></div>`;
}

function bindDpTooltips(){
  const tooltip=document.getElementById('dp-tooltip');if(!tooltip)return;
  let hideTimer;
  function show(text,x,y){tooltip.innerHTML=text.replace(/\n/g,'<br>');tooltip.classList.add('visible');position(x,y);}
  function position(x,y){
    const pad=12;let left=x+pad,top=y+pad;const rect=tooltip.getBoundingClientRect();
    if(left+rect.width>window.innerWidth)left=x-rect.width-pad;
    if(top+rect.height>window.innerHeight)top=y-rect.height-pad;
    tooltip.style.left=left+'px';tooltip.style.top=top+'px';
  }
  function hide(){tooltip.classList.remove('visible');}
  document.querySelectorAll('.dash-proto [data-tip]').forEach(el=>{
    el.addEventListener('mouseenter',e=>{clearTimeout(hideTimer);show(el.dataset.tip,e.clientX,e.clientY);});
    el.addEventListener('mousemove',e=>position(e.clientX,e.clientY));
    el.addEventListener('mouseleave',()=>{hideTimer=setTimeout(hide,80);});
  });
  tooltip.addEventListener('mouseenter',()=>clearTimeout(hideTimer));
  tooltip.addEventListener('mouseleave',hide);
}

function removeSkillFromData(id){
  const idx=DATA.skills.findIndex(x=>x.id===id);if(idx===-1)return;
  const s=DATA.skills[idx];DATA.skills.splice(idx,1);
  if(DATA.overview){
    const ov=DATA.overview;
    ov.total_skills=Math.max(0,(ov.total_skills||0)-1);
    if(s.anomaly)ov.token_heavy=Math.max(0,(ov.token_heavy||0)-1);
    if(s.status_color==='warn'||s.status_color==='danger')ov.unused_skills=Math.max(0,(ov.unused_skills||0)-1);
    if(typeof s.size_bytes==='number'&&s.size_bytes>0){
      ov.total_storage_bytes=Math.max(0,(ov.total_storage_bytes||0)-s.size_bytes);
      ov.total_storage=sizeH(ov.total_storage_bytes);
    }
  }
  if(DATA.storage&&DATA.storage.summary){
    const sum=DATA.storage.summary;
    sum.skill_total=Math.max(0,(sum.skill_total||0)-1);
    if(typeof s.size_bytes==='number')sum.skill_bytes=Math.max(0,(sum.skill_bytes||0)-s.size_bytes);
  }
  if(Array.isArray(DATA.riskySkills))DATA.riskySkills=DATA.riskySkills.filter(x=>x.id!==id);
  if(Array.isArray(DATA.overlapPairs))DATA.overlapPairs=DATA.overlapPairs.filter(p=>(p.a&&p.a.id)!==id&&(p.b&&p.b.id)!==id);
  const b=document.getElementById('b-skills');
  if(b&&DATA.overview){b.textContent=DATA.overview.total_skills;b.className='badge'+(DATA.overview.unused_skills?' warn':'');}
}

function drawSk(){

    return true;
  });
  const k=skSort.key;arr.sort((a,b)=>{let x=a[k],y=b[k];if(x==null)x='';if(y==null)y='';if(typeof x==='string')return x.localeCompare(y,'zh')*skSort.dir;return (x-y)*skSort.dir;});

  document.getElementById('sk-body').innerHTML=arr.map(s=>`

      <td style="font-family:var(--mono);font-size:12px">${s.use_count}</td>
      <td class="tok-cell ${s.anomaly?'hot':''}">${s.token.toLocaleString()}</td>
      <td style="font-family:var(--mono);font-size:12px;color:var(--dim)">${s.size_human}</td>
      <td>${s.security_tier==='低'?'<span style="color:var(--dim)">—</span>':`<span class="mini-find ${tierCls(s.security_tier)}">⚠ ${s.security_tier}</span>`}</td>
      <td><span class="pill ${s.status_color}">${s.status}</span></td>
      <td><div class="act-bar">
        <button class="btn up" data-act="up" data-id="${esc(s.id)}">升级</button>

      </div></td>
    </tr>`).join('')||'<tr><td colspan="10"><div class="empty"><div class="e-ico">∅</div>无匹配 Skill</div></td></tr>';
  document.querySelectorAll('#sk-body [data-act]').forEach(b=>b.onclick=function(){
    const s=DATA.skills.find(x=>x.id===this.dataset.id);if(!s)return;
    if(this.dataset.act==='up')upgradeSkill(s);else deleteSkill(s);
  });
}

function updateStorageAfterClean(catId,freed){
  const cat=DATA.storage.categories.find(x=>x.id===catId);freed=freed||0;
  if(cat){
    cat.size_bytes=Math.max(0,(cat.size_bytes||0)-freed);
    cat.size_human=sizeH(cat.size_bytes);
    cat.file_count=0;
    if(cat.risk==='safe'||cat.risk==='cautious'){
      const sum=DATA.storage.summary,key=cat.risk;
      sum[key+'_bytes']=Math.max(0,(sum[key+'_bytes']||0)-freed);
      sum[key+'_total']=sizeH(sum[key+'_bytes']);
    }
  }
  if(DATA.overview){
    DATA.overview.total_storage_bytes=Math.max(0,(DATA.overview.total_storage_bytes||0)-freed);
    DATA.overview.total_storage=sizeH(DATA.overview.total_storage_bytes);
  }
  const b=document.getElementById('b-storage');
  if(b&&DATA.overview)b.textContent=DATA.overview.total_storage;
  if(currentTab==='storage')renderStorage(document.getElementById('content'));
  if(currentTab==='overview')renderOverview(document.getElementById('content'));
}

function cleanConversations(cat){

    const box=document.getElementById('sum-box'), cnt=document.getElementById('sel-cnt'), delBtn=document.getElementById('sel-del');

    function selItems(){return [...document.querySelectorAll('.sess-chk:checked')].map(c=>({rel:c.dataset.rel,title:c.dataset.title}));}
    document.getElementById('sel-sum').onclick=()=>{

        box.innerHTML=r.summaries.map(s=>`<div class="sum-item"><div class="sum-h">${esc(s.title||s.rel)} ${s.used_ai?'<span class="pill g">AI</span>':'<span class="pill">规则</span>'}</div><div class="sum-body">${esc(s.summary)}</div></div>`).join('');
        toast('会话总结已生成，请确认后删除');
      }).catch(e=>{box.innerHTML='<div class="warn">'+apiErrorHint(e)+'</div>';});
    };
    delBtn.onclick=()=>{
      const sel=selItems();if(!sel.length){toast('请先勾选会话');return;}
      const freed=[...document.querySelectorAll('.sess-chk:checked')].reduce((a,c)=>a+(parseInt(c.dataset.size)||0),0);

        updateStorageAfterClean(cat.id,freed);
        openModal('✅ 已放入回收站',`<p>已删除 <b>${r.deleted}</b> 个会话，并生成会话总结备份。</p>
          <div class="hint">原始会话已移入<b>系统回收站</b>，可从回收站恢复。总结备份位于：<br><code>${esc(r.backup)}</code></div>`,()=>{},false);
      }).catch(e=>{delBtn.disabled=false;delBtn.textContent='🗑️ 确认删除（'+sel.length+'）';openModal('⚠️ 删除失败',`<p>${apiErrorHint(e)}</p>`,()=>{},false);});
    };
  }).catch(e=>{openModal('⚠️ 加载失败',`<p>${apiErrorHint(e)}</p>`,()=>{},false);});
}

const PAGE_SIZE = 10;

// ── 零件库：人偶 + 胶囊 + 货架 ──
let shelfFilter='', shelfQuery='', shelfView='card', shelfPage=1;
function renderShelf(c){
  const W=DATA.workshop;
  let pills='<div class="nav-pill'+(shelfFilter===''?' active':'')+'" data-ci="">▦ 全部</div>';
  W.categories.forEach((cat,i)=>{pills+='<div class="nav-pill'+(shelfFilter===String(i)?' active':'')+'" data-ci="'+i+'">'+CAT_ICON[i%CAT_ICON.length]+' '+esc(cat.name)+' <b>'+cat.count+'</b></div>';});
  const vc=shelfView==='card'?' active':'', vl=shelfView==='list'?' active':'';
  c.innerHTML=`
    <div class="sec-head"><h2>📦 模板库</h2><span class="tag">${W.stats.parts} 个模板 · ${W.stats.categories} 分类</span></div>
    <div class="shelf-nav">${pills}</div>
    <div class="search-box" style="margin-bottom:14px"><span class="si">🔍</span><input id="shelf-q" placeholder="搜索模板名称 / 描述 / 分类…" value="${esc(shelfQuery)}"></div>
    <div class="view-bar"><div class="view-toggle">
      <button class="vt-btn${vc}" data-svt="card">📱 卡片</button>
      <button class="vt-btn${vl}" data-svt="list">📋 列表</button>
    </div><span class="res" id="shelf-res"></span></div>
    <div id="shelf-body"></div>`;

  c.querySelectorAll('.nav-pill').forEach(p=>p.onclick=()=>{
    c.querySelectorAll('.nav-pill').forEach(x=>x.classList.remove('active'));p.classList.add('active');
    shelfFilter=p.dataset.ci;shelfPage=1;renderShelfBody();
  });
  c.querySelectorAll('[data-svt]').forEach(b=>b.onclick=function(){shelfView=this.dataset.svt;renderShelfBody();});
  c.querySelector('#shelf-q').addEventListener('input',e=>{shelfQuery=e.target.value;shelfPage=1;renderShelfBody();});
  renderShelfBody();
}
function getFilteredParts(){
  const W=DATA.workshop;let all=[];
  W.categories.forEach((cat,ci)=>{
    if(shelfFilter!==''&&ci!==parseInt(shelfFilter))return;
    Object.entries(cat.subs).forEach(([sn,ps])=>ps.forEach(p=>all.push(Object.assign({},p,{'_sub':sn}))));
  });
  if(shelfQuery){const q=shelfQuery.toLowerCase();
    all=all.filter(p=>[p.name,p.description,p.category,p.sub_category,p.type,''].join(' ').toLowerCase().includes(q));}
  return all;
}
function renderShelfBody(){
  const W=DATA.workshop;const body=document.getElementById('shelf-body');if(!body)return;
  const all=getFilteredParts();
  const totalPages=Math.max(1,Math.ceil(all.length/PAGE_SIZE));
  if(shelfPage>totalPages)shelfPage=totalPages;
  const start=(shelfPage-1)*PAGE_SIZE, pageItems=all.slice(start,start+PAGE_SIZE);
  const res=document.getElementById('shelf-res');if(res)res.textContent=all.length+' 个结果';
  let html='';
  if(shelfView==='card'){
    if(!pageItems.length)html='<div class="empty"><div class="e-ico">∅</div>没有匹配的模板</div>';
    else html='<div class="shelf-cards">'+pageItems.map(p=>`
      <div class="part-card" data-id="${esc(p.id)}" data-tooltip='${tooltipAttr({title:p.name,desc:p.description||'暂无描述',tags:[p.category||'',p.sub_category||'',p.type||'—',(p.usage_count||0)+' 次',p.source_type||'initial']})}'>

        <div class="part-desc">${esc(p.description||'')}</div>
        <div class="part-foot"><span class="use-tag">🔗 ${p.usage_count||0}</span><span class="chip">${esc(p.type||'—')}</span><span class="chip">${esc(p.source_type||'initial')}</span></div>
      </div>`).join('')+'</div>';
  }else{
    if(!pageItems.length)html='<div class="empty"><div class="e-ico">∅</div>没有匹配的模板</div>';
    else{      const rows=pageItems.map(p=>'<tr data-id="'+esc(p.id)+'" data-tooltip=\''+tooltipAttr({title:p.name,desc:p.description||'暂无描述',tags:[p.category||'',p.sub_category||'',p.type||'',(p.usage_count||0)+' 次',p.source_type||'initial']})+'\'>'+
      '<td class="lt-name">'+esc(p.name)+'</td>'+
      '<td class="lt-desc">'+esc(p.description||'—')+'</td>'+
      '<td><span class="lt-tag">'+esc(p.category||'')+'</span><span class="lt-tag">'+esc(p.sub_category||'')+'</span></td>'+
      '<td>'+esc(p.type||'')+'</td>'+
      '<td>'+(p.usage_count||0)+'次</td>'+
      '<td><span class="lt-tag">'+esc(p.source_type||'initial')+'</span></td>'+
      '</tr>').join('');
      html='<div class="table-wrap"><table><thead><tr><th>模板名称</th><th>描述</th><th>分类</th><th>类型</th><th>使用</th><th>来源</th></tr></thead><tbody>'+rows+'</tbody></table></div>';}
  }
  let pag='';
  if(totalPages>1){pag='<div class="pagination">'+
    '<button '+(shelfPage<=1?'disabled':'')+' data-spg="prev">◀ 上一页</button>'+
    '<span class="page-info">第 '+shelfPage+' / '+totalPages+' 页（共 '+all.length+' 个）</span>'+
    '<button '+(shelfPage>=totalPages?'disabled':'')+' data-spg="next">下一页 ▶</button></div>';}
  body.innerHTML=html+pag;
  body.querySelectorAll('[data-spg]').forEach(b=>b.onclick=function(){
    if(b.dataset.spg==='prev'&&shelfPage>1)shelfPage--;
    else if(b.dataset.spg==='next'&&shelfPage<totalPages)shelfPage++;
    renderShelfBody();
  });
  body.querySelectorAll('.part-card').forEach(card=>card.onclick=()=>showPartDetail(card.dataset.id));
  body.querySelectorAll('.table-wrap tbody tr').forEach(tr=>tr.onclick=function(){showPartDetail(tr.dataset.id);});
