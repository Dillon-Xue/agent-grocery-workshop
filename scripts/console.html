": "每日早安问候"}, "version": "v1.0", "depends_on": [], "conflicts_with": [], "usage_count": 0, "siblings": []}, "part_ref_001": {"id": "part_ref_001", "name": "Skill开发最佳实践", "category": "参考文档", "sub_category": "通用", "type": "参考文档", "description": "通用 Skill 开发指南", "content": "SKILL.md 第一行为名称；用 YAML frontmatter 写 description/metadata；步骤用有序列表；脚本放 scripts/；避免写死绝对路径；说明触发场景与示例。", "source_type": "initial", "metadata": {"tags": ["skill", "best-practice"], "author": "initial-pack"}, "version": "v1.0", "content_format": "text", "depends_on": [], "conflicts_with": [], "usage_count": 0, "siblings": []}, "part_test_参考文档_001": {"name": "Python 类型注解最佳实践", "description": "TypedDict / Protocol / Generic / TypeGuard 的进阶用法", "type": "参考文档", "sub_category": "语言特性", "content": "## Python 类型注解进阶\n\n### TypedDict\n```python\nclass UserInfo(TypedDict):\n    name: str\n    age: int\n    email: str | None\n```\n\n### Protocol（结构子类型）\n```python\nclass SupportsRead(Protocol):\n    def read(self, n: int = -1) -> bytes: ...\n```", "content_format": "markdown", "id": "part_test_参考文档_001", "category": "参考文档", "source_type": "initial", "version": "v1.0", "metadata": {"tags": ["test-data"]}, "usage_count": 0, "siblings": []}, "part_test_参考文档_002": {"name": "异步编程避坑指南", "description": "常见 asyncio 反模式：阻塞调用、未 await、取消传播、死锁", "type": "参考文档", "sub_category": "并发编程", "content": "## asyncio 常见陷阱\n\n1. **不要在 async 函数中调用同步阻塞 I/O**\n   ❌ `requests.get(url)` → ✅ `await aiohttp.get(url)`\n\n2. **永远 await gather 而不是手动创建 task 列表**\n   否则异常会被吞掉。\n\n3. **正确处理 cancellation**\n   用 `try/except asyncio.CancelledError` 清理资源。", "content_format": "markdown", "id": "part_test_参考文档_002", "category": "参考文档", "source_type": "initial", "version": "v1.0", "metadata": {"tags": ["test-data"]}, "usage_count": 0, "siblings": []}, "part_test_参考文档_003": {"name": "API 设计原则速查", "description": "RESTful + GraphQL 设计的 20 条黄金法则", "type": "参考文档", "sub_category": "API设计", "content": "## API 设计 20 条法则\n\n1. 名词复数作资源名：`/users` 不是 `/getUserList`\n2. 用 HTTP 方法表达意图：GET 读 / POST 创建 / PUT 全量替换 / PATCH 局部更新\n3. 分页用 cursor 而非 offset（大数据集更高效）\n4. 错误码用标准 HTTP status + 业务 code 双层结构\n5. 版本放 URL 不放 Header（方便调试）\n6. ...", "content_format": "markdown", "id": "part_test_参考文档_003", "category": "参考文档", "source_type": "initial", "version": "v1.0", "metadata": {"tags": ["test-data"]}, "usage_count": 0, "siblings": []}, "part_test_参考文档_004": {"name": "Docker 多阶段构建优化", "description": "镜像体积从 1GB 压到 50MB 的实战技巧", "type": "参考文档", "sub_category": "容器化", "content": "## Docker 镜像瘦身技巧\n\n### 多阶段构建\n```dockerfile\n# Stage 1: 构建\nFROM python:3.12-slim AS builder\nWORKDIR /app\nCOPY requirements.txt .\npip install --no-cache-dir -r requirements.txt\n\n# Stage 2: 运行\nFROM python:3.12-slim\nCOPY --from=builder /usr/local/lib/python3.12/site-packages /\nCMD [\"uvicorn\", \"main:app\", \"--host\", \"0.0.0.0\"]\n```", "content_format": "markdown", "id": "part_test_参考文档_004", "category": "参考文档", "source_type": "initial", "version": "v1.0", "metadata": {"tags": ["test-data"]}, "usage_count": 0, "siblings": []}, "part_test_参考文档_005": {"name": "Git Commit 规范", "description": "Conventional Commits 格式 + commit-msg hook 自动校验", "type": "参考文档", "sub_category": "Git工作流", "content": "## Conventional Commits\n\n格式：`<type>(<scope>): <subject>`\n\ntype:\n- feat: 新功能\n- fix: 修复 bug\n- docs: 文档变更\n- style: 格式调整\n- refactor: 重构\n- test: 测试相关\n- chore: 构建/工具变更\n\n示例：`feat(auth): support OAuth2 login flow`", "content_format": "markdown", "id": "part_test_参考文档_005", "category": "参考文档", "source_type": "initial", "version": "v1.0", "metadata": {"tags": ["test-data"]}, "usage_count": 0, "siblings": []}, "part_test_参考文档_006": {"name": "安全编码 Checklist", "description": "OWASP Top 10 对应的 Python 防御措施速查表", "type": "参考文档", "sub_category": "安全", "content": "## OWASP Top 10 — Python 防御\n\n| # | 威胁 | 防御措施 |\n|---|---|---|\n| A01 | 权限控制失效 | RBAC 中间件 + 资源所有权校验 |\n| A02 | 加密失败 | TLS 1.3 only + AES-256-GCM |\n| A03 | 注入 | 参数化查询 / ORM |\n| A04 | 不安全设计 | 威胁建模 + 架构评审 |\n| A05 | 安全配置误用 | 硬编码扫描 + .env 管理 |", "content_format": "markdown", "id": "part_test_参考文档_006", "category": "参考文档", "source_type": "initial", "version": "v1.0", "metadata": {"tags": ["test-data"]}, "usage_count": 0, "siblings": []}, "part_test_参考文档_007": {"name": "性能调优手册", "description": "CPU/内存/IO/IOPS 瓶颈定位与优化策略", "type": "参考文档", "sub_category": "性能优化", "content": "## 性能瓶颈定位\n\n### CPU 密集\n- **症状**: CPU 使用率高、响应慢\n- **工具**: `py-sperf` / `cProfile` / `viztracer`\n- **对策**: C 扩展 / multiprocessing / 算法优化\n\n### 内存密集\n- **症状**: OOM Kill / GC 频繁\n- **工具**: `memory_profiler` / `objgraph` / `tracemalloc`\n- **对策**: 生成器替代列表 / 对象池 / streaming 处理", "content_format": "markdown", "id": "part_test_参考文档_007", "category": "参考文档", "source_type": "initial", "version": "v1.0", "metadata": {"tags": ["test-data"]}, "usage_count": 0, "siblings": []}, "part_test_参考文档_008": {"name": "可观测性三支柱", "description": "Metrics / Logs / Traces 统一采集与关联方案", "type": "参考文档", "sub_category": "监控", "content": "## 可观测性三支柱\n\n### Metrics（指标）\n- Prometheus 采集 + Grafana 展示\n- RED 方法：Rate / Errors / Duration\n\n### Logs（日志）\n- 结构化 JSON 日志 → ELK / Loki\n- 关键：trace_id 贯穿全链路\n\n### Traces（链路追踪）\n- OpenTelemetry SDK 自动埋点\n- Jaeger / Zipkin 存储 + 查询", "content_format": "markdown", "id": "part_test_参考文档_008", "category": "参考文档", "source_type": "initial", "version": "v1.0", "metadata": {"tags": ["test-data"]}, "usage_count": 0, "siblings": []}, "part_dm_json_格式化助手_000": {"id": "part_dm_json_格式化助手_000", "name": "解析用户输入", "category": "需求分析", "sub_category": "JSON 格式化助手", "type": "Prompt片段", "description": "从剪贴板或文本框读取原始 JSON 字符串，容忍单行压缩格式与多余空白。", "content": "从剪贴板或文本框读取原始 JSON 字符串，容忍单行压缩格式与多余空白。", "content_format": "markdown", "source_type": "dismantled", "source_skill_id": "json_格式化助手", "source_skill_name": "JSON 格式化助手", "metadata": {"from_skill": "JSON 格式化助手"}, "version": "v1.0", "depends_on": [], "conflicts_with": [], "usage_count": 0, "siblings": [{"id": "part_dm_json_格式化助手_002", "name": "语法校验"}, {"id": "part_dm_json_格式化助手_001", "nam ta": {"tags": ["test-data"]}, "usage_count": 0, "siblings": []}, "part_test_需求分析_009": {"name": "数据流映射工具", "description": "可视化描述数据在各模块间的流转与转换规则", "type": "流程规范", "sub_category": "场景分析", "content": "## 数据流图规范\n输入源 → [处理节点] → 输出目标\n标注每一步的数据格式与转换逻辑", "content_format": "markdown", "id": "part_test_需求分析_009", "category": "需求分析", "source_type": "initial", "version": "v1.0", "metadata": {"tags": ["test-data"]}, "usage_count": 0, "siblings": []}, "part_test_测试用例_001": {"name": "API 集成测试模板", "description": "使用 TestClient 对 FastAPI 端点做完整请求-响应验证", "type": "Python代码", "sub_category": "集成测试", "content": "from fastapi.testclient import TestClient\nimport pytest\n\n@pytest.fixture\ndef client():\n    from myapp.main import app\n    return TestClient(app)\n\ndef test_create_item(client):\n    resp = client.post('/items', json={'name':'test'})\n    assert resp.status_code == 201", "content_format": "python", "id": "part_test_测试用例_001", "category": "测试用例", "source_type": "initial", "version": "v1.0", "metadata": {"tags": ["test-data"]}, "usage_count": 0, "siblings": []}, "part_test_测试用例_002": {"name": "并发压力测试脚本", "description": "asyncio + aiohttp 模拟多用户并发访问，收集响应时间 P50/P99", "type": "Python代码", "sub_category": "性能测试", "content": "import asyncio, aiohttp, time, statistics\n\nasync def worker(session: aiohttp.ClientSession, url: str, results: list):\n    start = time.perf_counter()\n    async with session.get(url) as resp:\n        await resp.text()\n        results.append(time.perf_counter() - start)", "content_format": "python", "id": "part_test_测试用例_002", "category": "测试用例", "source_type": "initial", "version": "v1.0", "metadata": {"tags": ["test-data"]}, "usage_count": 0, "siblings": []}, "part_test_测试用例_003": {"name": "Mock 外部服务桩", "description": "可配置延迟/错误率/固定响应的 HTTP Mock Server fixture", "type": "Python代码", "sub_category": "集成测试", "content": "from unittest.mock import patch, AsyncMock\nimport pytest, json\n\n@pytest.fixture\ndef mock_payment_service():\n    with patch('myapp.servi ion": "单元测试框架骨架", "content": "def test_example():\n    assert 1 + 1 == 2\n\ndef test_raises():\n    import pytest\n    with pytest.raises(ValueError):\n        int('x')", "content_format": "python", "source_type": "initial", "metadata": {"tags": ["pytest"], "author": "initial-pack"}, "version": "v1.0", "depends_on": [], "conflicts_with": [], "usage_count": 0, "siblings": []}, "part_tst_002": {"id": "part_tst_002", "name": "测试数据构造模板", "category": "测试用例", "sub_category": "数据构造", "type": "Python代码片段", "description": "模拟数据生成", "content": "import dataclasses\n\ndef make_sample(**overrides):\n    base = {'id': 1, 'name': 'sample'}\n    base.update(overrides)\n    return base", "content_format": "python", "source_type": "initial", "metadata": {"tags": ["fixture"], "author": "initial-pack"}, "version": "v1.0", "depends_on": [], "conflicts_with": [], "usage_count": 0, "siblings": []}, "part_tst_003": {"id": "part_tst_003", "name": "集成测试模板", "category": "测试用例", "sub_category": "联调", "type": "流程规范", "description": "多模块联调方案", "content": "准备环境 → 灌入测试数据 → 依次调用模块A/B/C → 校验最终状态 → 清理。每个步骤失败立即中断并保留现场日志。", "source_type": "initial", "metadata": {"tags": ["integration"], "author": "initial-pack"}, "version": "v1.0", "content_format": "text", "depends_on": [], "conflicts_with": [], "usage_count": 0, "siblings": []}, "part_test_依赖工具_001": {"name": "Poetry 依赖管理", "description": "pyproject.toml Poetry 标准配置：依赖组、构建后端、发布流程", "type": "配置文件", "sub_category": "包管理", "content": "[tool.poetry]\nname = \"my-package\"\nversion = \"0.1.0\"\ndescription = \"A sample package\"\nauthors = [\"Author <email@example.com>\"]\n\n[tool.poetry.dependencies]\npython = \"^3.11\"\nfastapi = \"^0.110\"\n\n[tool.poetry.group.dev.dependencies]\npytest = \"^8.0\"\nruff = \"^0.3\"", "content_format": "toml", "id": "part_test_依赖工具_001", "category": "依赖工具", "source_type": "initial", "version": "v1.0", "metadata": {"tags": ["test-data"]}, "usage_count": 0, "siblings": []}, "part_test_依赖工具_002": {"name": "Ruff Lint 配置", "d function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function escapeRe(s){return (s||'').replace(/[.*+?^${}()|[\]\\]]/g,'\\$&');}
// 轻量 Markdown 渲染（离线、无外部依赖），先转义防 XSS
function mdRender(text){
  const src=(text||'').replace(/\r\n/g,'\n');
  const lines=src.split('\n');
  let html='';let i=0;
  let inCode=false, codeBuf=[];
  const flushCode=()=>{ if(codeBuf.length){ html+='<pre class="md-code"><code>'+esc(codeBuf.join('\n'))+'</code></pre>'; codeBuf=[]; } };
  // GFM 表格辅助：分隔行形如 |---|---| 或 | --- | --- |
  const isTableSep=(l)=>/^\s*\|?(\s*:?-{2,}:?\s*\|)+\s*:?-{2,}:?\s*\|?\s*$/.test(l);
  const isTableRow=(l)=>{const t=l.trim(); return t.startsWith('|')||t.endsWith('|');};
  const splitRow=(r)=>r.trim().replace(/^\|/,'').replace(/\|$/,'')
    .split('|').map(c=>c.trim())
    .map(c=>c.replace(/^:?(left|center|right):?$/i,'')||c); // 容忍对齐标记
  while(i<lines.length){
    let line=lines[i];
    const fence=line.match(/^```(.*)$/);
    if(fence){ if(inCode){ flushCode(); inCode=false; } else { inCode=true; codeBuf=[]; } i++; continue; }
    if(inCode){ codeBuf.push(line); i++; continue; }
    // GFM 表格：表头行 + 分隔行 + 数据行
    if(isTableRow(line) && i+1<lines.length && isTableSep(lines[i+1])){
      const header=splitRow(line); i+=2;
      const rows=[];
      while(i<lines.length && isTableRow(lines[i])){ rows.push(splitRow(lines[i])); i++; }
      let t='<div class="md-table-wrap"><table class="md-table"><thead><tr>'
        +header.map(h=>'<th>'+inlineMd(h)+'</th>').join('')
        +'</tr></thead><tbody>';
      for(const r of rows){ t+='<tr>'+r.map(c=>'<td>'+inlineMd(c)+'</td>').join('')+'</tr>'; }
      t+='</tbody></table></div>';
      html+=t; continue;
    }
    const h=line.match(/^(#{1,4})\s+(.*)$/);
    if(h){ const lv=h[1].length; html+='<h'+lv+' class="md-h md-h'+lv+'">'+inlineMd(h[2])+'</h'+lv+'>'; i++; continue; }
    if(/^>\s?/.test(line)){ html+='<blockquote class="md-quote">'+inlineMd(line.replace(/^>\s?/,''))+'</blockquote>'; i++; continue; }
    if(/^\s*[-*]\s+/.test(line)){ html+='<li class="md-li">'+inlineMd(line.replace(/^\s*[-*]\s+/,''))+'</li>'; i++; continue; }
    if(/^\s*\d+\.\s+/.test(line)){ html+='<li class="md-li md-ol">'+inlineMd(line.replace(/^\s*\d+\.\s+/,''))+'</li>'; i++; continue; }
    if(!line.trim()){ html+='<div class="md-sp"></div>'; i++; continue; }
    html+='<p class="md-p">'+inlineMd(line)+'</p>'; i++;
  }
  flushCode();
  return html;
}
function inlineMd(t){
  let s=esc(t);
  s=s.replace(/`([^`]+)`/g,'<code class="md-icode">$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/\*([^*]+)\*/g,'<em>$1</em>');
  s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,(m,txt,url)=>{
    const u=(url||'').trim();
    const safe=/^(https?:|mailto:|\/|#)/i.test(u);
    return safe?('<a href="'+u+'" target="_blank" rel="noopener">'+txt+'</a>'):('<span>'+txt+'</span>');
  });
  return s;
}
// 列表摘要中的关键词高亮（已转义，安全）
function highlightStr(text,query){
  const t=esc(text||'');
  const q=esc((query||'').trim());
  if(!q)return t;
  const re=new RegExp('('+escapeRe(q)+')','gi');
  return t.replace(re,'<mark class="sr-hl">$1</mark>');
}
// 在 DOM 子树中高亮关键词，返回匹配数量
function highlightMatches(root,query){
  const q=(query||'').trim();
  if(!q||!root)return 0;
  const re=new RegExp('('+escapeRe(q)+')','gi');
  const testRe=new RegExp(escapeRe(q),'i');
  let count=0;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null,false);
  const targets=[];let node;
  while(node=walker.nextNode()){
    if(!node.nodeValue)continue;
    if(node.parentNode&&(node.parentNode.tagName==='MARK'||(node.parentNode.closest&&node.parentNode.closest('script,style'))))continue;
    if(testRe.test(node.nodeValue))targets.push(node);
  }
  re.lastIndex=0;
  targets.forEach(n=>{
    const frag=document.createDocumentFragment();
    const parts=n.nodeValue.split(re);
    re.lastIndex=0;
    parts.forEach(p=>{
      if(testRe.test(p)){ const m=document.createElement('mark'); m.className='sr-hl'; m.textContent=p; frag.appendChild(m); count++; }
      else frag.appendChild(document.createTextNode(p));
    });
    if(n.parentNode)n.parentNode.replaceChild(frag,n);
  });
  return count;
}

// ── 后端地址 ── 优先跟随当前页面 origin，否则默认 localhost:8080；可在设置页覆盖
function getApiBase(){
  try{
    const cfg = JSON.parse(localStorage.getItem('wb_console_api_base') || '{}');
    if(cfg.base_url) return cfg.base_url.replace(/\/$/,'');
  }catch(e){}
  if(location.protocol.startsWith('http')) return location.origin;
  return 'http://127.0.0.1:8080';
}
function apiUrl(path){ return getApiBase() + path; }
function apiErrorHint(e){
  const msg=(e&&e.message)?e.message:String(e);
  const base=getApiBase();
  if(/failed to fetch|networkerror|无法连接|net::err/i.test(msg)){
    return '无法连接控制台后端 '+base+'。<br>请确认已运行 <code style="background:var(--surface-2);padding:2px 6px;border-radius:4px">python server.py</code>，或通过「设置」修改后端地址。';
  }
  return esc(msg);
}
function apiPost(path,body){
  return fetch(apiUrl(path),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>{
    const ct=(r.headers.get('content-type')||'');
    if(!r.ok || !ct.includes('application/json')){
      return r.text().then(()=>{ throw new Error('后端未返回有效 JSON（可能是静态页面或后端未启动）'); });
    }
    return r.json();
  });
}

      html+=esc(obj.desc||'');
    }
    if(obj.tags&&obj.tags.length) html+='<div class="tt-row">'+obj.tags.map(t=>'<span class="chip">'+esc(t)+'</span>').join('')+'</div>';
    return html;
  }
  document.body.addEventListener('mouseover',e=>{
    const el=e.target.closest('[data-tooltip]'); if(!el)return;
    clearHide();
    const data=el.dataset.tooltip; if(!data)return;
    let html='';
    try{ html=buildHtml(JSON.parse(data)); }catch(err){ html=esc(data); }
    tt.innerHTML=html; tt.classList.add('show');
    positionTooltip(el,tt);
  });
  document.body.addEventListener('mouseout',e=>{
    const el=e.target.closest('[data-tooltip]'); if(!el)return;
    scheduleHide();
  });
  document.body.addEventListener('mousemove',e=>{
    const el=e.target.closest('[data-tooltip]'); if(!el)return; positionTooltip(el,tt);
  });
  tt.addEventListener('mouseenter',clearHide);
  tt.addEventListener('mouseleave',()=>tt.classList.remove('show'));
  tt.addEventListener('click',e=>{
    const item=e.target.closest('.tt-part-item'); if(!item)return;
    e.preventDefault(); e.stopPropagation();
    tt.classList.remove('show');
    goToPartAndFilter(item.dataset.pname||'');
  });
}
function positionTooltip(el,tt){
  const r=el.getBoundingClientRect(), tr=tt.getBoundingClientRect();
  const pad=8;
  // 优先贴在触发元素右侧，垂直居中
  let left=r.right+pad, top=r.top+(r.height-tr.height)/2;
  // 右侧空间不足则放到元素左侧
  if(left+tr.width>window.innerWidth-pad) left=r.left-tr.width-pad;
  // 左侧被截断则贴左边界
  if(left<pad) left=pad;
  // 下方空间不足则向上展开
  if(top+tr.height>window.innerHeight-pad) top=window.innerHeight-tr.height-pad;
  if(top<pad) top=pad;
  tt.style.top=top+'px'; tt.style.left=left+'px';
}

// ── Donut ──
function donut(segs){
  const R=54, C=2*Math.PI*R, total=segs.reduce((a,s)=>a+s.v,0)||1;
  let off=0, arcs='';
  segs.forEach(s=>{
    const len=s.v/total*C;
    arcs+=`<circle cx="69" cy="69" r="${R}" fill="none" stroke="${s.c}" stroke-width="13" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 69 69)"/>`;
    off+=len;
  });
  return `<svg class="donut" viewBox="0 0 138 138">${arcs}</svg>`;
}

// ── Overview ──
function dpDonut(segs){
  const total=segs.reduce((a,s)=>a+s.v,0)||1;
  let acc=0, stops=[];
  segs.forEach(s=>{const p=s.v/total;stops.push(`${s.c} ${acc*360}deg ${(acc+p)*360}deg`);acc+=p;});
  return `<div class="dp-donut" style="background:conic-gradient(${stops.join(',')})"><div class="center"><div class="big">${dpHealth()}</div><div class="small">HEALTH</div></div></div>`;
}
function dpHealth(){
  const cnt={safe:0,warn:0,danger:0,neutral:0};
  DATA.skills.forEach(s=>cnt[s.status_color=(s.status_color||'neutral')]++);
  const n=DATA.skills.length||1;
  return Math.round((cnt.safe*100+cnt.warn*70+cnt.neutral*80+cnt.danger*30)/n);
}
function dpBar(nm,v,max,c,tip){
  const pct=max?Math.round(v/max*100):0;
  return `<div class="dp-bar-row" data-tip="${esc(tip)}"><div class="nm">${esc(nm)}</div><div class="track"><div class="fill" style="width:${pct}%;background:${c};color:${c}"></div></div><div class="vl">${v}</div></div>`;
}

function refreshOverview(retry=0){
  return apiPost('/api/overview',{}).then(d=>{
    if(d.ok && d.data){
      const nd=d.data;
      DATA.overview=nd.overview;
      DATA.overview._fresh=true;
      if(nd.skills) DATA.skills=nd.skills;
      if(nd.storage) DATA.storage=nd.storage;
      if(nd.conversations) DATA.conversations=nd.conversations;
      if(nd.overlaps) DATA.overlaps=nd.overlaps;
      if(nd.anomalies) DATA.anomalies=nd.anomalies;
      updateSidebarBadges();
      if(currentTab==='anomalies') renderAnomalies(document.getElementById('content'));
      return true;
    }

function bindDpTooltips(){
  const tooltip=document.getElementById('dp-tooltip');if(!tooltip)return;
  let hideTimer;
  function show(text,x,y){tooltip.innerHTML=text.replace(/\n/g,'<br>');tooltip.classList.add('visible');position(x,y);}
  function position(x,y){
    const pad=12;let left=x+pad,top=y+pad;const rect=tooltip.getBoundingClientRect();
    if(left+rect.width>window.innerWidth)left=x-rect.width-pad;
    if(top+rect.height>window.innerHeight)top=y-rect.height-pad;
    tooltip.style.left=left+'px';tooltip.style.top=top+'px';
  }
  function hide(){tooltip.classList.remove('visible');}

function openSkillPath(id){
  // 由前端（浏览器，前台交互进程）直接触发 workbuddy:// 协议唤起。
  // 之前走后端 server.py 后台进程调用 SetForegroundWindow，被 Windows 的
  // ForegroundLockTimeout 限制拒绝，导致 WorkBuddy 无法抢到前台（只弹提示不打开）。
  // 浏览器是前台进程，由它发起协议唤起，Windows 视为用户直接意图，允许 WorkBuddy 置顶。
  var uri = 'workbuddy://home?skill=' + encodeURIComponent(id || '');
  try {
    var a = document.createElement('a');
    a.href = uri;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    toast('正在唤起 WorkBuddy（新建任务页面）…');
  } catch(e) {
    toast('唤起失败：' + apiErrorHint(e));
  }
}

function updateStorageAfterClean(catId,freed){
  const cat=DATA.storage.categories.find(x=>x.id===catId);freed=freed||0;
  if(cat){
    cat.size_bytes=Math.max(0,(cat.size_bytes||0)-freed);
    cat.size_human=sizeH(cat.size_bytes);
    cat.file_count=0;
    if(cat.risk==='safe'||cat.risk==='cautious'){
      const sum=DATA.storage.summary,key=cat.risk;
      sum[key+'_bytes']=Math.max(0,(sum[key+'_bytes']||0)-freed);
      sum[key+'_total']=sizeH(sum[key+'_bytes']);
    }
  }
  if(DATA.overview){
    DATA.overview.total_storage_bytes=Math.max(0,(DATA.overview.total_storage_bytes||0)-freed);
    DATA.overview.total_storage=sizeH(DATA.overview.total_storage_bytes);
  }
  const b=document.getElementById('b-storage');
  if(b&&DATA.overview)b.textContent=DATA.overview.total_storage;

  // 静态分享页或无后端连接时直接使用快照数据，避免向后端发请求返回 HTML 导致 JSON 解析报错
  if(window.STATIC_MODE || window.BACKEND_OK===false){
    const hint=window.STATIC_MODE
      ?'当前为静态分享页，展示快照数据，不执行实时扫描。'
      :'后端未连接，展示快照数据。';
    if(hasSnapshot) document.getElementById('st-table-wrap').insertAdjacentHTML('beforebegin','<div id="st-scanning" class="hint" style="margin:8px 0">'+hint+'</div>');
    return;
  }
  if(!(DATA.storage&&DATA.storage._fresh)){
    apiPost('/api/storage',{}).then(d=>{
      if(d.ok){
        DATA.storage=d.storage;
        if(d.fresh)DATA.storage._fresh=true;
        drawStorage();
        if(!d.fresh && currentTab==='storage'){
          document.getElementById('st-scanning')?.remove();
          document.getElementById('st-table-wrap').insertAdjacentHTML('beforebegin','<div id="st-scanning" class="hint" style="margin:8px 0">后台正在扫描真实占用，请稍候…</div>');
          setTimeout(()=>renderStorage(c), 6000);
        }
      }else{document.getElementById('st-table-wrap').innerHTML='<div class="empty" style="padding:28px 0"><div class="e-ico">⚠</div>存储扫描失败：'+(esc(d.error||'未知错误'))+'</div>';}
    }).catch(e=>{document.getElementById('st-table-wrap').innerHTML='<div class="empty" style="padding:28px 0"><div class="e-ico">⚠</div>'+apiErrorHint(e)+'</div>';});
  }
}
function drawStorage(){
  const wrap=document.getElementById('st-table-wrap'); if(!wrap)return;
  const cats=(DATA.storage&&DATA.storage.categories)||[];
  const sum=(DATA.storage&&DATA.storage.summary)||{};
  ['safe','cautious','skill','never'].forEach(k=>{const el=document.getElementById('kpi-'+k);if(el)el.textContent=sum[k+'_total']||'0 B';});
  const totalPages=Math.max(1,Math.ceil(cats.length/ST_PAGE_SIZE));
  if(stPage>totalPages)stPage=totalPages;if(stPage<1)stPage=1;
  const start=(stPage-1)*ST_PAGE_SIZE, pageCats=cats.slice(start,start+ST_PAGE_SIZE);
  const rows=pageCats.map(cat=>{
    const act = cat.risk==='safe' ? '<button class="clean" data-path="'+esc(cat.path)+'">清理</button>'
      : cat.risk==='cautious' ? '<button class="clean warn" data-path="'+esc(cat.path)+'">谨慎清理</button>'
      : '<span style="color:var(--faint)">—</span>';
    return `<tr>
      <td><div class="skill-name"><div><div class="nm">${esc(cat.name)}</div></div></div></td>
      <td style="font-family:var(--mono);font-size:12px">${cat.file_count}</td>
      <td style="font-family:var(--mono);font-size:12px">${cat.size_human}</td>
      <td><span class="pill ${cat.risk==='safe'?'safe':cat.risk==='cautious'?'warn':cat.risk==='skill'?'neutral':'danger'}">${cat.risk_label}</span></td>
      <td><div class="sc-actions">${act}</div></td>
    </tr>`;
  }).join('');
  wrap.innerHTML=`<table><thead><tr><th>类别</th><th>文件数量</th><th>占用空间</th><th>清理建议</th><th>操作</th></tr></thead><tbody>${rows||'<tr><td colspan="5"><div class="empty" style="padding:28px 0"><div class="e-ico">∅</div>暂无分类数据</div></td></tr>'}</tbody></table>`;
  wrap.querySelectorAll('.sc-actions button').forEach(b=>b.onclick=function(){
    const cat=cats.find(x=>x.path===this.dataset.path);if(cat)cleanCategory(cat);
  });
  const pager=document.getElementById('st-pager');
  if(totalPages<=1){pager.innerHTML='';return;}
  pager.innerHTML=`<button ${stPage<=1?'disabled':''} data-stg="prev">◀ 上一页</button><span class="page-info">第 ${stPage} / ${totalPages} 页（共 ${cats.length} 条）</span><button ${stPage>=totalPages?'disabled':''} data-stg="next">下一页 ▶</button>`;
  pager.querySelectorAll('[data-stg]').forEach(b=>b.onclick=function(){
    if(b.dataset.stg==='prev'&&stPage>1)stPage--;
    else if(b.dataset.stg==='next'&&stPage<totalPages)stPage++;
    drawStorage();
  });
}

function placeCapsules(mode='detail'){
  const arenaEl=document.getElementById('arena');
  if(!arenaEl)return;
  if(capsuleRotator){clearInterval(capsuleRotator);capsuleRotator=null;}
  arenaEl.querySelectorAll('.capsule').forEach(el=>el.remove());
  const skills=DATA.skills||[];
  if(!skills.length)return;
  const aw=arenaEl.clientWidth||arenaEl.offsetWidth||800, ah=arenaEl.clientHeight||arenaEl.offsetHeight||480;
  if(aw<100||ah<100){requestAnimationFrame(()=>placeCapsules(mode));return;}

  // 概览页大盘：胶囊分批轮询展示，每批固定 20 个，每 3 秒切换
  if(arenaEl.classList.contains('dp-arena')){
    const realSkills=skills.filter(s=>s.id && !String(s.id).startsWith('_bak_'));
    if(!realSkills.length)return;
    const totalBatches=Math.max(1, Math.ceil(realSkills.length / CAPSULE_BATCH_SIZE));
    if(capsuleBatch >= totalBatches) capsuleBatch = 0;
    const batchSkills = realSkills.slice(capsuleBatch * CAPSULE_BATCH_SIZE, (capsuleBatch + 1) * CAPSULE_BATCH_SIZE);
    const colors=['var(--cyan)','var(--purple)','var(--green)','var(--amber)','var(--blue)','var(--red)'];
    const marginX=34, marginY=22;
    const avW=Math.min(aw*0.26, ah*0.44), avH=ah*0.56;
    const avX=(aw-avW)/2, avY=ah-avH;
    const buffer=10;
    const inAvatar=(x,y,extra=0)=> x>avX-buffer-extra && x<avX+avW+buffer+extra && y>avY-buffer-extra;

    const n=batchSkills.length;
    const target=Math.max(16, Math.round(n*1.6));
    const aspect=aw/ah;
    const rows=Math.max(3, Math.round(Math.sqrt(target/aspect)));
    const cols=Math.max(3, Math.round(target/rows));
    const gapX=(aw-2*marginX)/Math.max(1, cols-1);
    const gapY=(ah-2*marginY)/Math.max(1, rows-1);

    const points=[];
    const addPoint=(x,y)=>{
      if(inAvatar(x,y)) return;
      const d=Math.hypot(x-aw/2, y-ah*0.42);
      if(!points.some(p=>Math.abs(p.x-x)<5 && Math.abs(p.y-y)<5)) points.push({x,y,d});
    };
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        addPoint(marginX+c*gapX, marginY+r*gapY);
      }
    }
    if(points.length < n){
      const gx=gapX*0.55, gy=gapY*0.55;
      for(let y=marginY+gy/2; y<ah-marginY; y+=gy){
        for(let x=marginX+gx/2; x<aw-marginX; x+=gx) addPoint(x,y);
      }
    }
    points.sort((a,b)=>a.d-b.d);

    const placed=[];
    batchSkills.forEach((s,i)=>{
      const p=points[i]; if(!p) return;
      const el=document.createElement('div');
      el.className='capsule';
      el.style.animationDuration=(7.5+Math.random()*4.5).toFixed(2)+'s';
      el.style.animationDelay=(-Math.random()*8).toFixed(2)+'s';
      el.style.left=p.x+'px'; el.style.top=p.y+'px';
      const c=colors[i%colors.length];
      el.style.borderColor=c; el.style.color=c;
      el.innerHTML=esc(s.display_name);
      el.title=s.display_name+' | '+esc(s.source||'');
      el.onclick=(e)=>{e.stopPropagation(); showSkillDetail(s.id);};
      arenaEl.appendChild(el);
      placed.push({el,x:p.x,y:p.y});
    });

    requestAnimationFrame(()=>{
      const boxes=placed.map(p=>{const r=p.el.getBoundingClientRect();return{el:p.el,x:p.x,y:p.y,w:r.width+10,h:r.height+10};});
      let moved=true,iter=0;
      while(moved && iter<120){
        moved=false;iter++;
        for(let i=0;i<boxes.length;i++){
          for(let j=i+1;j<boxes.length;j++){
            const a=boxes[i],b=boxes[j];
            const dx=a.x-b.x,dy=a.y-b.y;
            const dist=Math.hypot(dx,dy)||1;
            if(Math.abs(dx)<(a.w+b.w)/2 && Math.abs(dy)<(a.h+b.h)/2){
              const ux=dx/dist,uy=dy/dist;
              const push=Math.max(4,((a.w+b.w)/2 - dist)*0.5+3);
              a.x+=ux*push;a.y+=uy*push;
              b.x-=ux*push;b.y-=uy*push;
              moved=true;
            }
          }
        }
      }
      boxes.forEach(b=>{
        b.x=Math.max(marginX, Math.min(aw-marginX, b.x));
        b.y=Math.max(marginY, Math.min(ah-marginY, b.y));
        if(inAvatar(b.x,b.y,4)){
          const toTop=Math.abs(b.y-(avY-buffer)), toLeft=Math.abs(b.x-(avX-buffer)), toRight=Math.abs(b.x-(avX+avW+buffer));
          if(toTop<=toLeft && toTop<=toRight) b.y=avY-buffer-b.h/2;
          else if(toLeft<=toRight) b.x=avX-buffer-b.w/2;
          else b.x=avX+avW+buffer+b.w/2;
        }
        b.el.style.left=b.x+'px';b.el.style.top=b.y+'px';
      });
    });

    capsuleRotator=setInterval(()=>{
      capsuleBatch=(capsuleBatch+1)%totalBatches;
      placeCapsules(mode);
    },3000);
    return;
  }

  // 非概览页 arena（如有）仍按热度全量展示，但不带 token 数字
  const maxTok=Math.max(1,...skills.map(s=>s.token||0));
  const n=skills.length;
  const indexed=skills.map((s,i)=>({i,heat:Math.min(1,(s.token||0)/maxTok)})).sort((a,b)=>b.heat-a.heat);
  const avW=Math.min(aw*0.38, ah*0.85), avH=ah*0.82;
  const avX=(aw-avW)/2, avY=ah-avH;
  const inAv=(x,y,m=0)=> x>avX-m && x<avX+avW+m && y>avY-m && y<avY+avH+m;
  const aspect=aw/ah;
  const cols=Math.min(18,Math.max(5,Math.round(Math.sqrt(n*aspect*1.2))));
  const rows=Math.ceil(n/cols)+1;
  const padX=Math.max(10, aw*0.025), padY=Math.max(10, ah*0.03);
  const effW=aw-2*padX, effH=ah-2*padY;
  const cellW=effW/cols, cellH=effH/(rows+0.5);
  const cells=[];
  for(let r=0;r<rows;r++){
    const rc=[];
    for(let col=0;col<cols;col++){
      const cx=padX+col*cellW+cellW/2;
      const cy=padY+r*cellH+cellH/2;
      if(inAv(cx,cy,cellW*0.25)) continue;
      rc.push({cx,cy});
    }
    if(r%2===1)rc.reverse();
    cells.push(...rc);
  }
  indexed.forEach(({i,heat})=>{
    if(!cells.length)return;
    const t=cells.shift();
    const size=Math.max(52,Math.min(120,48+heat*72));
    const el=document.createElement('div');
    el.className='capsule';
    let jx=(Math.random()*2-1)*cellW*0.12;
    let jy=(Math.random()*2-1)*cellH*0.12;
    let x=t.cx+jx, y=t.cy+jy;
    if(inAv(x,y,18)){
      if(Math.abs(x-(avX+avW/2))<avW/2) y=Math.min(y, avY-18);
      else x=x<avX+avW/2?avX-18:avX+avW+18;
    }
    el.style.left=x+'px';el.style.top=y+'px';
    el.style.minWidth=(size*0.7)+'px';
    const col=heatColor(heat);
    el.style.borderColor=col;el.style.color=col;el.style.opacity=(0.5+heat*0.5).toFixed(2);
    const s=skills[i];
    el.innerHTML=esc(s.display_name);
    el.title=s.display_name+' | '+esc(s.source||'');
    el.onclick=(e)=>{if(mode==='detail')showSkillDetail(s.id);else toast('Skill：'+s.display_name+'（见「Skill 管理」）');};
    arenaEl.appendChild(el);
  });
  const ar=arenaEl.getBoundingClientRect();
  arenaEl.querySelectorAll('.capsule').forEach(el=>{
    const r=el.getBoundingClientRect();
    let left=parseFloat(el.style.left)||0, top=parseFloat(el.style.top)||0;
    if(r.left<ar.left+8) left += ar.left+8-r.left;
    if(r.right>ar.right-8) left -= r.right-(ar.right-8);
    if(r.top<ar.top+8) top += ar.top+8-r.top;
    if(r.bottom>ar.bottom-8) top -= r.bottom-(ar.bottom-8);
    el.style.left=left+'px'; el.style.top=top+'px';
  });
}

// ── Skill生成记录 ──
// 内存中的生成任务（切 tab 不丢，刷新丢失；产物已落盘可重载）
let runningGenerations=[];
let openDrawerJobId=null;
// 动态拉取磁盘上已落盘的生成记录（进 tab / 刷新时调用），覆盖 EMBEDDED_DATA 静态快照，
// 解决「刷新浏览器后新生成的 Skill 记录消失」的问题。带缓存，force=true 时强制刷新。
let _gensPromise=null;
function loadGenerations(force){
  if(_gensPromise && !force) return _gensPromise;
  _gensPromise=apiPost('/api/skill/generations',{}).then(d=>{
    if(d&&d.ok && Array.isArray(d.generations)){
      DATA.workshop.generations=d.generations;
      const n=d.generations.length;
      if(DATA.workshop.stats)DATA.workshop.stats.generations=n;
      const a=document.getElementById('b-skilldev'); if(a)a.textContent=n;
      const b=document.getElementById('b-dismantle'); if(b)b.textContent=n;
    }
  }).catch(()=>{});
  return _gensPromise;
}

// 实时拉取零件工坊数据（零件库 + 生成/拆解记录 + 实时引用次数），
// 解决「拆解入库零件 / 引用次数未实时刷新」的问题（需求1、需求6）。带缓存，force=true 时强制刷新。
let _wsPromise=null;
function loadWorkshop(force){
  if(_wsPromise && !force) return _wsPromise;
  _wsPromise=apiPost('/api/workshop',{}).then(d=>{
    if(d&&d.ok && d.workshop){
      DATA.workshop=d.workshop;
      const W=DATA.workshop||{}, st=W.stats||{};
      const a=document.getElementById('b-shelf'); if(a)a.textContent=st.parts||0;
      const b=document.getElementById('b-skilldev'); if(b)b.textContent=st.generations||0;
      const c=document.getElementById('b-dismantle'); if(c)c.textContent=st.generations||0;
    }
  }).catch(()=>{});
  return _wsPromise;
}

function _drawerSelectedParts(record){
  const W=DATA.workshop||{}, partsById=W.parts_by_id||{};
  let sp=record.selected_parts || (record.result&&record.result.selected_parts) || [];
  if(!sp.length){
    const ids=record.used_part_ids || record.selected_part_ids || [];
    sp=ids.map(id=>{
      const p=partsById[id];
      return p?{id:id,name:p.name,type:p.type||'零件',description:p.description||'',reason:'来自已选用零件'}:null;
    }).filter(Boolean);
  }
  return sp;
}

function renderGenDrawerContent(record){
  const body=document.getElementById('genDrawerBody');
  const title=document.getElementById('genDrawerTitle');
  if(!body)return;
  if(title)title.textContent=record.name||'生成详情';
  const W=DATA.workshop||{}, partsById=W.parts_by_id||{};
  const isRun=!!record._running;
  let statusClass,statusLabel;
  if(isRun){
    if(record.status==='error'){statusClass='err';statusLabel='生成失败';}
    else if(record.status==='done'){statusClass='done';statusLabel='已生成';}
    else{statusClass='';statusLabel='生成中';}
  }else{statusClass='done';statusLabel='已生成';}

  const tags=(record.tags||[]).map(t=>'<span class="gd-tag">'+esc(t)+'</span>').join('');

  // 进度
  let progressHtml='';
  if(isRun){
    const lines=record.progress||[];
    if(lines.length){
      progressHtml='<div class="gd-progress">'+lines.map(p=>'<div class="gd-pg-line">'+esc(p)+'</div>').join('')+'</div>';
    }else{
      progressHtml='<div class="gd-empty">等待开始…</div>';
    }
  }else{
    progressHtml='<div class="gd-progress"><div class="gd-pg-line"> 生成完成：'+(record.id ? 'generations/'+esc(record.id)+'/SKILL.md' : '')+'</div></div>';
  }
  if(record.status==='error'){
    progressHtml='<div class="gd-progress"><div class="gd-pg-line" style="border-left-color:var(--red)"> '+(record.error||'生成失败')+'</div></div>'+progressHtml;
  }

  // 选用零件
  const sp=_drawerSelectedParts(record);
  let partsHtml='';
  if(sp.length){
    partsHtml='<div class="gd-parts">'+sp.map(p=>{
      const meta=(p.type||'零件')+(p.id?' · '+p.id:'');
      return '<div class="gd-part"><div class="gd-part-name">'+esc(p.name||p.id)+'</div><div class="gd-part-meta">'+esc(meta)+'</div><div class="gd-part-reason">'+esc(p.reason||p.description||'')+'</div></div>';
    }).join('')+'</div>';
  }else{
    partsHtml='<div class="gd-empty">未匹配到现成零件，基于需求描述直接生成。</div>';
  }

  // 产物与操作
  let productHtml='';
  const content=record.result&&record.result.content || record.content || '';
  const resultPath=record.result&&record.result.path || (record.id ? 'generations/'+record.id+'/SKILL.md' : '');
  const installId=record.result&&record.result.id || record.id || '';
  if(content){
    productHtml='<pre class="gd-code">'+esc(content)+'</pre>';
  }else if(!isRun || record.status==='done'){
    productHtml='<div class="gd-empty">产物 SKILL.md 已落盘。可在列表页点击「安装到 WorkBuddy」或查看本地文件。</div>';
  }
  const actionsHtml=(installId && (!isRun || record.status==='done'))
    ?'<div class="gd-actions"><button class="btn primary" onclick="_installGeneratedFromDrawer()">安装到 WorkBuddy</button>'+
      '<button class="btn" data-act="git" data-id="'+esc(installId)+'">提交 Git</button>'+
      '<button class="btn" data-act="publish" data-id="'+esc(installId)+'">发布 SkillHub</button></div>'
    :'';

  body.innerHTML=
    '<div class="gd-section">'+
      '<div class="gd-label">状态</div>'+
      '<span class="gd-status '+statusClass+'">'+statusLabel+'</span>'+
    '</div>'+
    '<div class="gd-section">'+
      '<div class="gd-label">需求</div>'+
      '<div class="gd-desc">'+esc(record.description||record.initial_query||'(无描述)')+'</div>'+
      (tags?'<div class="gd-tags">'+tags+'</div>':'')+
    '</div>'+
    '<div class="gd-section">'+
      '<div class="gd-label">生成过程</div>'+progressHtml+
    '</div>'+
    '<div class="gd-section">'+
      '<div class="gd-label">选用零件（'+sp.length+' 个）</div>'+partsHtml+
    '</div>'+
    (productHtml?'<div class="gd-section"><div class="gd-label">产物 SKILL.md</div><div class="gd-path" style="font-size:12px;color:var(--dim);margin-bottom:10px;word-break:break-all">'+esc(resultPath)+'</div>'+productHtml+actionsHtml+'</div>':'');

  // 安装按钮需要 id，通过 data 属性暂存
  if(actionsHtml){
    const btn=body.querySelector('.gd-actions button');
    if(btn)btn.dataset.id=installId;
    body.querySelectorAll('.gd-actions [data-act]').forEach(b=>{
      b.onclick=(e)=>{e.stopPropagation();
        const id=b.dataset.id;
        if(b.dataset.act==='git')_gitSyncGenerated(id,b);
        else if(b.dataset.act==='publish')_publishGenerated(id,b);
      };
    });
  }
}
function _installGeneratedFromDrawer(){
  const btn=document.querySelector('#genDrawerBody .gd-actions button');
  if(!btn || !btn.dataset.id){toast('没有可安装的 Skill');return;}
  _installGenerated(btn.dataset.id, btn);
}
function _gitSyncGenerated(id,btn){
  if(!id){toast('请先生成 Skill');return;}
  if(!CFG.github.token){toast('请先在「设置 → GitHub 发布」配置 GitHub Token，才能提交到 Git');switchTab('settings');return;}
  if(btn){btn.disabled=true;btn.textContent='提交中…';}
  apiPost('/api/skill/git',{id:id}).then(d=>{
    if(btn){btn.disabled=false;btn.textContent='提交 Git';}
    if(!d.ok){toast('Git 同步失败：'+(d.error||''));return;}
    toast('已提交 Git：'+(d.repo_url||'')+(d.steps&&d.steps.length?'\n'+d.steps.join('；'):''));
  }).catch(e=>{if(btn){btn.disabled=false;btn.textContent='提交 Git';}toast('请求失败：'+apiErrorHint(e));});
}
function _publishGenerated(id,btn){
  if(!id){toast('请先生成 Skill');return;}
  if(!CFG.skillhub.api_key){toast('请先在「设置 → SkillHub」配置 API Key，才能发布到 SkillHub');switchTab('settings');return;}
  if(btn){btn.disabled=true;btn.textContent='发布中…';}
  apiPost('/api/skill/publish',{id:id}).then(d=>{
    if(btn){btn.disabled=false;btn.textContent='发布 SkillHub';}
    if(!d.ok){toast('发布失败：'+(d.error||''));return;}
    toast('SkillHub 发布成功'+(d.verify?'\n验证：'+d.verify:''));
  }).catch(e=>{if(btn){btn.disabled=false;btn.textContent='发布 SkillHub';}toast('请求失败：'+apiErrorHint(e));});
}

function _renderSkillDev(c){
  const W=DATA.workshop, savedGens=W.generations||[];
  const head='<div class="sec-head" style="justify-content:space-between"><h2> Skill开发</h2><button class="btn primary" id="btnNewSkill">新建 Skill</button></div>';

  // 合并已落盘记录与运行中任务：运行中放最前，按 id 去重（避免 done 后 running 与落盘重复）
  const running=runningGenerations.map(r=>({...r, _running:true}));
  const seen=new Set();
  const all=[];
  for(const g of [...running, ...savedGens]){
    if(g&&g.id){ if(seen.has(g.id))continue; seen.add(g.id); }
    all.push(g);
  }

  if(!all.length){c.innerHTML=head+'<div class="empty">暂无生成记录<br><span style="font-size:11px">点击右上角「新建 Skill」开始自动生成</span></div>';bindNewSkill();return;}

      else if(g.installed===false){statusClass='r';statusLabel='安装失败';}
      else{statusClass='cyan';statusLabel='已生成';}

      actionHtml='<span class="sk-act-link" data-act="install" data-job="'+esc(g.id||'')+'">'+installLabel+'</span>'+

        '<span class="sk-act-link" data-act="publish" data-job="'+esc(g.id||'')+'">发布Skillhub</span>'+
        '<span class="sk-act-link" data-act="dismantle" data-job="'+esc(g.id||'')+'">拆解</span>';

      '<td><div class="lt-desc" title="'+esc(desc)+'">'+esc(descShort||'—')+'</div></td>'+

      goToPartAndFilter(p&&p.name?p.name:first);
    };
  });
  c.querySelectorAll('[data-spg]').forEach(b=>b.onclick=function(){
    if(b.dataset.spg==='prev'&&skillDevPage>1)skillDevPage--;

function bindNewSkill(){

function _startGenPoll(jobId){
  const rec=runningGenerations.find(r=>r.id===jobId);
  if(!rec||rec.status==='done'||rec.status==='error')return;
  if(rec._timer)return;
  rec._timer=setInterval(()=>{
    apiPost('/api/skill/generate-status',{job_id:jobId}).then(d=>{
      if(!d.ok||!d.job)return;
      const j=d.job;
      Object.assign(rec,j);
      if(currentTab==='skilldev')renderSkillDev(document.getElementById('content'));
      if(openDrawerJobId===jobId)renderGenDrawerContent(rec);
      if(j.status==='done'||j.status==='error'){
        clearInterval(rec._timer);rec._timer=null;
        loadWorkshop(true); // 完成的记录并入落盘列表，刷新后也能看到
      }
    }).catch(()=>{});
  },1500);
}

function renderDismantle(c){ loadWorkshop().then(()=>_renderDismantle(c)); }
function _renderDismantle(c){
  const W=DATA.workshop, gens=W.generations||[];
  if(!gens.length){c.innerHTML='<div class="empty">暂无拆解任务<br><span style="font-size:11px">Skill 自动拆解回填进度会出现在这里</span></div>';return;}

  const totalPages=Math.max(1,Math.ceil(gens.length/PAGE_SIZE));
  if(dsmPage>totalPages)dsmPage=totalPages;
  const start=(dsmPage-1)*PAGE_SIZE, pageItems=gens.slice(start,start+PAGE_SIZE);

  const rows=pageItems.map(g=>{
    const done=!!g.auto_dismantled || g.status==='done';
    const dismantling=g.status==='dismantling';
    const failed=g.status==='error';
    let statusClass, statusLabel;
    if(failed){statusClass='r';statusLabel='拆解失败';}
    else if(dismantling){statusClass='cyan';statusLabel='拆解中';}
    else if(done){statusClass='g';statusLabel='拆解完成';}
    else {statusClass='y';statusLabel='待拆解';}
    const idStr=g.id?g.id.slice(0,8):'—';
    const desc=g.description||'';
    const descShort=desc.length>40?desc.slice(0,40)+'…':desc;
    let prodCell;
    if(failed) prodCell='<span style="color:var(--red)">'+esc(g.error||'失败')+'</span>';
    else if(dismantling) prodCell='<span style="color:var(--dim)">拆解进行中…</span>';
    else if(done){
      const parts=resolveGenerationParts(g);
      prodCell='<div class="comp-cell">'+componentCountHtml(parts)+'</div>';
    }else prodCell='<span style="color:var(--faint)">—</span>';
    return '<tr data-dsm="'+esc(g.id||'')+'">'+
      '<td><div class="skill-name"><div><div class="nm">'+esc(g.name)+'</div><div class="id">'+esc(g.slug||'')+'</div></div></div></td>'+
      '<td><div class="lt-desc" title="'+esc(desc)+'">'+esc(descShort||'—')+'</div></td>'+
      '<td>'+esc(g.created_at||'')+'</td>'+
      '<td><span class="lt-tag '+statusClass+'">'+statusLabel+'</span></td>'+
      '<td>'+prodCell+'</td>'+
      '<td><div class="sk-acts">'+
        '<button class="btn btn-dsm-run'+(done?' active':'')+'" data-dsm="'+esc(g.id||'')+'">'+(done?'重新拆解':(dismantling?'拆解中…':'执行拆解'))+'</button>'+
      '</div></td>'+
    '</tr>';
  }).join('');

  let pag='';
  if(totalPages>1){pag='<div class="pagination">'+
    '<button '+(dsmPage<=1?'disabled':'')+' data-dpg="prev">◀ 上一页</button>'+
    '<span class="page-info">第 '+dsmPage+' / '+totalPages+' 页（共 '+gens.length+' 条）</span>'+
    '<button '+(dsmPage>=totalPages?'disabled':'')+' data-dpg="next">下一页 ▶</button></div>';}

  c.innerHTML='<div class="sec-head"><h2> 任务拆解</h2><span class="tag">'+gens.length+' 条</span></div>'+
    '<div class="table-wrap">'+
      '<table><thead><tr><th>Skill 名称</th><th>功能描述</th><th>创建时间</th><th>拆解状态</th><th>拆解产物</th><th>操作</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '</div>'+pag;

  // 行点击打开右侧抽屉
  const open=(id)=>{const rec=gens.find(g=>g.id===id); if(rec)openDsmDrawer(rec);};
  c.querySelectorAll('tbody tr[data-dsm]').forEach(tr=>{tr.onclick=()=>open(tr.dataset.dsm);});
  c.querySelectorAll('.btn-dsm-run').forEach(btn=>{btn.onclick=(e)=>{e.stopPropagation(); _runDismantle(btn.dataset.dsm, btn);};});
  c.querySelectorAll('.comp-count[data-pid]').forEach(el=>{
    el.onclick=(e)=>{
      e.stopPropagation();
      const pid=el.dataset.pid; if(!pid)return;
      const W=DATA&&DATA.workshop||{};
      const p=(W.parts_by_id||{})[pid];
      goToPartAndFilter(p&&p.name?p.name:pid);
    };
  });
  c.querySelectorAll('[data-dpg]').forEach(b=>b.onclick=function(){
    if(b.dataset.dpg==='prev'&&dsmPage>1)dsmPage--;
    else if(b.dataset.dpg==='next'&&dsmPage<totalPages)dsmPage++;
    _renderDismantle(c);
  });
}

let openDsmJobId=null;

function renderDsmDrawerContent(record){
  const body=document.getElementById('genDrawerBody');
  const title=document.getElementById('genDrawerTitle');
  if(!body)return;
  if(title)title.textContent='拆解详情：'+(record.name||'');

  const done=!!record.auto_dismantled || record.status==='done';
  const dismantling=record.status==='dismantling';
  const failed=record.status==='error';
  const cands=record.dismantle_candidates||[];
  const statusText=failed?'拆解失败':(dismantling?'拆解中':(done?'拆解完成':'待拆解'));

  // 拆解进度：5 个固定步骤
  const steps=[
    {icon:'',label:'读取 SKILL.md 产物'},
    {icon:'',label:'按章节识别零件边界'},
    {icon:'',label:'语义归类（Prompt / 代码 / 流程）'},
    {icon:'',label:'生成候选零件描述'},
    {icon:'',label:'落盘到 library/ 等待审核'}
  ];
  let progressHtml='<div class="gd-timeline">';
  steps.forEach((s,i)=>{
    const reached=done;
    progressHtml+='<div class="gd-tl-item '+(reached?'done':'')+'">'+
      '<span class="gd-tl-dot">'+(reached?'':(i+1))+'</span>'+
      '<span class="gd-tl-text">'+s.icon+' '+esc(s.label)+'</span>'+
    '</div>';
  });
  progressHtml+='</div>';

  // 候选零件
  let partsHtml='';
  if(cands.length){
    partsHtml='<div class="gd-parts">'+cands.map(p=>{
      const meta=(p.category||'未分类')+(p.type?' · '+p.type:'');
      return '<div class="gd-part"><div class="gd-part-name">'+esc(p.name||'')+'</div><div class="gd-part-meta">'+esc(meta)+'</div><div class="gd-part-reason">'+esc(p.description||'')+'</div></div>';
    }).join('')+'</div>';
  }else{
    partsHtml='<div class="gd-empty">'+(done?'本次未识别到可用候选零件。':'尚未执行拆解，点击下方按钮开始。')+'</div>';
  }

  const actionsHtml='<div class="gd-actions">'+
    '<button class="btn primary" onclick="_runDismantleFromDrawer()">'+(done?'重新拆解':(dismantling?'拆解中…':'执行拆解'))+'</button>'+
    '</div>';

  body.innerHTML=
    '<div class="gd-section">'+
      '<div class="gd-label">拆解状态</div>'+
      '<span class="gd-status '+(done?'done':(failed?'err':''))+'"'+(dismantling?' style="background:rgba(34,211,238,.15);color:#22d3ee"':'')+'>'+statusText+'</span>'+
    '</div>'+
    '<div class="gd-section">'+
      '<div class="gd-label">来源 Skill</div>'+
      '<div class="gd-desc">'+esc(record.name||'')+'</div>'+
      '<div style="font-size:12px;color:var(--dim);margin-top:6px">路径：generations/'+esc(record.id||'')+'/SKILL.md</div>'+
    '</div>'+
    '<div class="gd-section">'+
      '<div class="gd-label">拆解进度</div>'+progressHtml+
    '</div>'+
    '<div class="gd-section">'+
      '<div class="gd-label">候选零件（'+cands.length+' 个）</div>'+partsHtml+
    '</div>'+actionsHtml;

  const btn=body.querySelector('.gd-actions button');
  if(btn)btn.dataset.id=record.id||'';
}
function _runDismantleFromDrawer(){
  const btn=document.querySelector('#genDrawerBody .gd-actions button');
  if(!btn||!btn.dataset.id){toast('没有可拆解的任务');return;}
  _runDismantle(btn.dataset.id, btn);
}
function _runDismantle(id, btn){
  if(!id){toast('请选择一个任务');return;}
  if(btn){btn.disabled=true;btn.textContent='拆解中…';}
  _setDsmButtons(id, true, '拆解中…');
  apiPost('/api/skill/dismantle',{id:id}).then(d=>{
    if(!d.ok){if(btn){btn.disabled=false;btn.textContent='执行拆解';} _setDsmButtons(id, false, '执行拆解'); toast('拆解失败：'+(d.error||''));return;}
    // 轮询直到拆解完成 / 失败，期间列表实时显示「拆解中」（需求2·问题1）
    const poll=()=>{
      loadWorkshop(true).then(()=>{
        const rec=(DATA.workshop.generations||[]).find(g=>g.id===id);
        if(rec&&openDsmJobId===id)renderDsmDrawerContent(rec);
        if(rec&&rec.status==='done'){
          if(btn){btn.disabled=false;btn.textContent='重新拆解';}
          _setDsmButtons(id, false, '重新拆解');
          toast('拆解完成，识别 '+((rec.dismantle_candidates||[]).length)+' 个候选零件');
          if(currentTab==='dismantle')renderDismantle(document.getElementById('content'));
          return;
        }
        if(rec&&rec.status==='error'){
          if(btn){btn.disabled=false;btn.textContent='执行拆解';}
          _setDsmButtons(id, false, '执行拆解');
          toast('拆解失败：'+(rec.error||'未知错误'));
          if(currentTab==='dismantle')renderDismantle(document.getElementById('content'));
          return;
        }
        setTimeout(poll,1500);
      });
    };
    poll();
  }).catch(e=>{if(btn){btn.disabled=false;btn.textContent='执行拆解';} _setDsmButtons(id, false, '执行拆解'); toast('拆解请求失败：'+apiErrorHint(e));});
}

const CHAT_STORE_KEY='wb_chat_sessions_v1';
let chatSkill=null, chatMessages=[];
let LLM_CFG={base_url:'',api_key:'',model:''};
let CFG={github:{token:''},skillhub:{api_key:''}};  // 缓存 git/skillhub 配置状态，供按钮门禁判断
function fmtChatTime(iso){try{const d=new Date(iso);return d.toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e){return iso||'';}}
function readChatStore(){try{return JSON.parse(localStorage.getItem(CHAT_STORE_KEY)||'{}');}catch(e){return {};}}
function writeChatStore(store){localStorage.setItem(CHAT_STORE_KEY,JSON.stringify(store));}
function getChatSession(skillId){return readChatStore().sessions?.[skillId]||null;}
function listChatSessions(){const store=readChatStore();return Object.values(store.sessions||{}).sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));}
function saveChatSession(skillId,messages){
  const store=readChatStore();if(!store.sessions)store.sessions={};
  const skill=DATA.skills.find(s=>s.id===skillId);
  const prev=store.sessions[skillId]?.skill||{};
  store.sessions[skillId]={messages,skill:skill?{id:skill.id,display_name:skill.display_name}:prev,updatedAt:new Date().toISOString()};
  store.lastSkillId=skillId;writeChatStore(store);
}
function clearChatSession(skillId){
  const store=readChatStore();if(store.sessions&&store.sessions[skillId]){delete store.sessions[skillId];writeChatStore(store);}
}
function restoreChatState(){
  const store=readChatStore();
  if(store.lastSkillId){
    chatSkill=DATA.skills.find(s=>s.id===store.lastSkillId)||null;
    chatMessages=chatSkill?(getChatSession(chatSkill.id)?.messages||[]):[];
  }
}

function renderHistoryMain(){

}
function runChatSearch(q){
  chatSearchQuery=q;
  if(!q){chatSearchResults=null;chatSearching=false;selectedSession=null;renderHistoryTree();renderHistoryMain();return;}
  chatSearching=true;chatSearchResults=null;selectedSession=null;
  renderHistoryTree();renderHistoryMain();
  apiPost('/api/search',{query:q,scope:'all',max_results:30,sort_by:'time'}).then(data=>{
    chatSearching=false;
    if(!data.ok){toast('检索失败：'+(data.error||'未知错误'));chatSearchResults=[];}
    else{chatSearchResults=data.results||[];}
    renderHistoryMain();
  }).catch(e=>{chatSearching=false;toast('检索请求失败：'+apiErrorHint(e));chatSearchResults=[];renderHistoryMain();});
}
function findSessionRel(project,sid){
  for(const g of historyGroups){
    if(g.project!==project && !(project.startsWith('app')&&g.project.startsWith('app'))) continue;
    for(const s of g.sessions){ if(s.id===sid) return s.rel; }
  }
  return '';
}

      '<div class="sr-snippet">'+highlightStr(r.summary,chatSearchQuery)+'</div>'+
      (r.code_snippet?'<pre class="sr-code"><code>'+esc(r.code_snippet)+'</code></pre>':'')+
    '</div>';
  }).join('');
  main.innerHTML='<div class="chat-main-head"><div class="chat-main-title"> 检索结果</div><div class="chat-main-sub">关键词：'+esc(chatSearchQuery)+' · '+results.length+' 条</div></div>'+
    '<div class="chat-msg-list" id="chatSearchList">'+rows+'</div>';
  main.querySelectorAll('.chat-search-result[data-rel]').forEach(el=>{
    el.onclick=()=>{
      if(!el.dataset.rel)return;
      chatSearchHighlight=true; // 保留关键词，进入详情页后高亮命中

function loadSessionDetail(sess){
  const main=document.getElementById('histMain');
  main.innerHTML='<div class="chat-main-head"><div class="chat-main-title">'+esc(sess.title||sess.rel)+'</div><div class="chat-main-sub">'+esc(sess.project)+'</div></div>'+
    '<div class="chat-msg-list" id="histMsgList"><div style="align-self:center;color:var(--dim);font-size:13px">加载中…</div></div>';
  apiPost('/api/conversation/detail',{rel:sess.rel}).then(d=>{
    const list=document.getElementById('histMsgList');
    if(!d.ok){list.innerHTML='<div style="align-self:center;color:var(--red)">读取失败：'+esc(d.error||'')+'</div>';return;}
    if(!d.messages||!d.messages.length){list.innerHTML='<div style="align-self:center;color:var(--dim)">该会话没有可展示的消息</div>';return;}
    list.innerHTML=d.messages.map(m=>{
      const role=m.role==='user'?'user':(m.role==='assistant'?'assistant':'reasoning');
      const label=role==='user'?'你':(role==='assistant'?'助手':'思考');
      const time=m.time?fmtChatTime(m.time):'';
      return '<div class="chat-msg '+role+'"><div class="chat-msg-role">'+label+'</div>'+mdRender(m.content)+(time?'<div class="chat-msg-time">'+time+'</div>':'')+'</div>';
    }).join('');
    list.scrollTop=list.scrollHeight;
    if(chatSearchHighlight){
      const n=highlightMatches(list,chatSearchQuery);
      if(n>0){
        const first=list.querySelector('mark.sr-hl');
        if(first)first.scrollIntoView({block:'center'});
        const sub=main.querySelector('.chat-main-sub');
        if(sub)sub.innerHTML+=' · <span class="hl-count">命中 '+n+' 处</span>';
      }
      chatSearchHighlight=false;
    }
  }).catch(e=>{
    document.getElementById('histMsgList').innerHTML='<div style="align-self:center;color:var(--red)">读取失败：'+esc(apiErrorHint(e))+'</div>';
  });
}
function renderSkillTab(wrap){
  if(!chatSkill)restoreChatState();
  const sessions=listChatSessions();
  const lh=sessions.length?sessions.map(sess=>{
    const skill=DATA.skills.find(s=>s.id===sess.skill.id);
    const name=skill?skill.display_name:(sess.skill.display_name||sess.skill.id);
    const lastMsg=sess.messages.length?String(sess.messages[sess.messages.length-1].content||'').slice(0,36):'无消息';
    const sub='最近活跃 '+fmtChatTime(sess.updatedAt)+' · '+sess.messages.length+' 条';
    const active=(chatSkill&&chatSkill.id===sess.skill.id)?' active':'';
    return '<div class="conv-tree-session'+active+'" data-sid="'+esc(sess.skill.id)+'"><div class="s-title">'+esc(name)+'</div><div class="s-meta">'+esc(sub)+'<br><span style="color:var(--faint)">'+esc(lastMsg)+(lastMsg.length>=36?'…':'')+'</span></div></div>';
  }).join(''):'<div class="empty">暂无对话记录<br><span style="font-size:11px">选择一个 Skill 开始对话，消息会自动保存</span></div>';
  const skills=(DATA.skills||[]).map(s=>'<div class="sp'+(chatSkill&&chatSkill.id===s.id?' active':'')+'" data-id="'+esc(s.id)+'" data-tooltip=\''+tooltipAttr({title:s.display_name,desc:s.description||'暂无描述',tags:[s.source||'',s.size_human||'']})+'\'>'+esc(s.display_name)+'</div>').join('');
  wrap.innerHTML='<div class="chat-sidebar"><div class="chat-sidebar-head"> 最近对话</div><div class="chat-tree" id="convList">'+lh+'</div></div>'+
    '<div class="chat-box"><div class="chat-bar"><b>与 Skill 对话</b>'+(chatSkill?'<span class="tag g">'+esc(chatSkill.display_name)+'</span>':'<span class="tag">未选择 skill</span>')+'</div>'+
    '<div class="skill-pick" id="skillPick">'+skills+'</div>'+
    '<div class="chat-msgs" id="chatMsgs"><div class="msg boss"> 选择一个 Skill，然后开始对话。<br>（若未配置 LLM，请先在「设置」页填写 Base URL / API Key / Model）</div></div>'+
    '<div class="chat-in"><textarea id="chatInput" rows="3" placeholder="输入消息…"></textarea><button class="btn primary" id="chatSend">发送</button></div></div>';
  wrap.querySelectorAll('#convList .conv-tree-session[data-sid]').forEach(row=>{row.onclick=()=>{chatSkill=DATA.skills.find(s=>s.id===row.dataset.sid)||null;chatMessages=chatSkill?(getChatSession(chatSkill.id)?.messages||[]):[];saveChatSession(chatSkill?chatSkill.id:'',chatMessages);renderChat(document.getElementById('content'));};});
  wrap.querySelectorAll('#skillPick .sp').forEach(sp=>sp.onclick=()=>{chatSkill=DATA.skills.find(s=>s.id===sp.dataset.id)||null;chatMessages=chatSkill?(getChatSession(chatSkill.id)?.messages||[]):[];if(chatSkill){const st=readChatStore();st.lastSkillId=chatSkill.id;writeChatStore(st);}renderChat(document.getElementById('content'));});
  const msgs=document.getElementById('chatMsgs');
  if(chatSkill){
    if(chatMessages.length){
      msgs.innerHTML=chatMessages.map(m=>{
        const cls=m.role==='user'?'you':'boss';
        const txt=mdRender(String(m.content||''));
        return '<div class="msg '+cls+'">'+txt+'</div>';
      }).join('');
      msgs.scrollTop=msgs.scrollHeight;
    }else{
      msgs.innerHTML='<div class="msg boss"> 与 <b>'+esc(chatSkill.display_name)+'</b> 开始对话。<br>历史消息会自动保存，切换页面后仍可恢复。</div>';
    }
  }
  const send=()=>{
    const inp=document.getElementById('chatInput'); const v=(inp.value||'').trim(); if(!v)return;
    if(!chatSkill){toast('请先选择一个 Skill');return;}
    inp.value=''; const msgs=document.getElementById('chatMsgs');
    const me=document.createElement('div'); me.className='msg you'; me.innerHTML=esc(v).replace(/\n/g,'<br>'); msgs.appendChild(me);
    chatMessages.push({role:'user',content:v,time:new Date().toISOString()});
    saveChatSession(chatSkill.id,chatMessages);
    const thinking=document.createElement('div'); thinking.className='msg boss'; thinking.innerHTML='<i>思考中…</i>'; msgs.appendChild(thinking); msgs.scrollTop=msgs.scrollHeight;
    const chatBody={skill_id:chatSkill.id,messages:chatMessages};
    if(LLM_CFG.base_url && LLM_CFG.api_key){chatBody.base_url=LLM_CFG.base_url;chatBody.api_key=LLM_CFG.api_key;chatBody.model=LLM_CFG.model||'gpt-4o';}
    apiPost('/api/chat',chatBody).then(data=>{
      thinking.remove();
      if(!data.ok){const err=document.createElement('div');err.className='msg boss';
        if((data.error||'').indexOf('请先配置')>=0){err.innerHTML=' 尚未配置 LLM。请先到「设置」页填写 Base URL / API Key / Model 并点击「 保存配置」，再回来对话。';}
        else{err.innerHTML=' '+esc(data.error||'请求失败');}
        msgs.appendChild(err);return;}
      const reply=document.createElement('div'); reply.className='msg boss'; reply.innerHTML=mdRender(data.content||'(无回复)'); msgs.appendChild(reply);
      chatMessages.push({role:'assistant',content:data.content||'',time:new Date().toISOString()});
      saveChatSession(chatSkill.id,chatMessages); msgs.scrollTop=msgs.scrollHeight;
    }).catch(e=>{thinking.remove();const err=document.createElement('div');err.className='msg boss';err.innerHTML=' 请求失败：'+apiErrorHint(e);msgs.appendChild(err);msgs.scrollTop=msgs.scrollHeight;});
  };
  document.getElementById('chatSend').onclick=send;
  document.getElementById('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter' && !e.shiftKey){e.preventDefault();send();}});
}

const GEN_DRAFT_KEY='wb_gen_draft_v1';

function clearGenDraft(){localStorage.removeItem(GEN_DRAFT_KEY);}
let genDraftTimer=null;
function scheduleGenDraftSave(fn){clearTimeout(genDraftTimer);genDraftTimer=setTimeout(fn,300);}

function renderGen(c){
  c.innerHTML='<div class="gen-grid">'+
    '<div class="gen-card">'+
      '<div class="gen-head">① 描述需求</div>'+
      '<div class="gen-row"><label>Skill 名称</label><input id="genName" placeholder="例如：pdf 表格提取助手"></div>'+
      '<div class="gen-row"><label>功能描述</label><textarea id="genDesc" rows="5" placeholder="这个 Skill 要做什么？支持哪些输入？产出什么？"></textarea></div>'+
      '<div class="gen-row"><label>标签（可选，逗号分隔）</label><input id="genTags" placeholder="pdf, 表格, 提取"></div>'+
      '<div class="gen-actions">'+
        '<button class="btn" id="genPlan">预览零件选用</button>'+
        '<button class="btn primary" id="genDo">生成 Skill</button>'+
      '</div>'+
    '</div>'+
    '<div class="gen-card">'+
      '<div class="gen-head">② 拼装与产物</div>'+
      '<div id="genPlanBox" class="gen-plan"><div class="gen-empty">点击「预览零件选用」查看自动匹配的零件。</div></div>'+
      '<div id="genResult" class="gen-result" style="display:none">'+
        '<div class="gen-result-head"><span id="genResultPath" class="gen-path"></span><button class="btn primary" id="genInstall" style="margin-left:auto">安装到 WorkBuddy</button></div>'+
        '<pre class="gen-skillmd"><code id="genSkillMd"></code></pre>'+
      '</div>'+
    '</div>'+
  '</div>';

  const nameEl=document.getElementById('genName');
  const descEl=document.getElementById('genDesc');
  const tagsEl=document.getElementById('genTags');
  const planBtn=document.getElementById('genPlan');
  const doBtn=document.getElementById('genDo');
  const planBox=document.getElementById('genPlanBox');
  const resultBox=document.getElementById('genResult');
  const skillMdEl=document.getElementById('genSkillMd');
  const pathEl=document.getElementById('genResultPath');
  const installBtn=document.getElementById('genInstall');
  let lastPlan=null;

  // 恢复草稿
  const draft=loadGenDraft();
  if(draft.name!==undefined)nameEl.value=draft.name;
  if(draft.desc!==undefined)descEl.value=draft.desc;
  if(draft.tags!==undefined)tagsEl.value=draft.tags;

  const saveDraft=()=>{localStorage.setItem(GEN_DRAFT_KEY,JSON.stringify({name:nameEl.value,desc:descEl.value,tags:tagsEl.value,ts:Date.now()}));};
  [nameEl,descEl,tagsEl].forEach(el=>{el.addEventListener('input',()=>scheduleGenDraftSave(saveDraft));});

  const gatherReq=()=>{
    const name=(nameEl.value||'').trim();
    const description=(descEl.value||'').trim();
    const tags=(tagsEl.value||'').split(',').map(t=>t.trim()).filter(Boolean);
    return {name,description,tags};
  };

  planBtn.onclick=()=>{
    const req=gatherReq();
    if(!req.name||!req.description){toast('请填写 Skill 名称与功能描述');return;}
    planBox.innerHTML='<div class="gen-empty">检索零件库中…</div>';
    apiPost('/api/skill/generate-plan',{requirements:req}).then(d=>{
      if(!d.ok){planBox.innerHTML='<div class="gen-empty gen-err">预览失败：'+(d.error||'')+'</div>';return;}
      lastPlan=d;
      const sel=d.selected||[];
      let html='<div class="gen-notes">'+esc(d.notes||'')+'</div>';
      if(sel.length){
        html+='<div class="gen-parts">'+sel.map(p=>'<div class="gen-part"><span class="gp-name">'+esc(p.name||p.id||'')+'</span><span class="gp-desc">'+esc(p.description||'')+'</span></div>').join('')+'</div>';
      }else{
        html+='<div class="gen-empty">未匹配到现成零件，将基于描述直接生成模板。</div>';
      }
      planBox.innerHTML=html;
    }).catch(e=>{planBox.innerHTML='<div class="gen-empty gen-err">请求失败：'+esc(apiErrorHint(e))+'</div>';});
  };

  doBtn.onclick=()=>{
    const req=gatherReq();
    if(!req.name||!req.description){toast('请填写 Skill 名称与功能描述');return;}
    doBtn.disabled=true;doBtn.textContent='生成中…';
    // 先关闭弹窗并插入「生成中」记录，再异步下发
    const jobIdPlaceholder='pending_'+Date.now();
    runningGenerations.unshift({
      id:jobIdPlaceholder,
      name:req.name,
      description:req.description,
      tags:req.tags,
      status:'running',
      progress:['已提交生成请求…'],
      created_at:new Date().toISOString(),
      result:null,error:null,
    });
    closeGenModal();
    clearGenDraft();
    if(currentTab==='skilldev')renderSkillDev(document.getElementById('content'));
    apiPost('/api/skill/generate',{requirements:req}).then(d=>{
      const rec=runningGenerations.find(r=>r.id===jobIdPlaceholder);
      if(!d.ok){
        if(rec){rec.status='error';rec.error=d.error||'下发失败';rec.progress=['下发失败：'+(d.error||'')];}
        toast('生成失败：'+(d.error||''));
        if(currentTab==='skilldev')renderSkillDev(document.getElementById('content'));
        return;
      }
      const jobId=d.job_id;
      if(rec){rec.id=jobId;rec.progress=['已加入生成队列'];}
      if(openDrawerJobId===jobIdPlaceholder){openDrawerJobId=jobId;renderGenDrawerContent(rec);}
      _startGenPoll(jobId);
    }).catch(e=>{
      const rec=runningGenerations.find(r=>r.id===jobIdPlaceholder);
      if(rec){rec.status='error';rec.error=apiErrorHint(e);rec.progress=['请求失败：'+apiErrorHint(e)];}
      toast('生成请求失败：'+apiErrorHint(e));
      if(currentTab==='skilldev')renderSkillDev(document.getElementById('content'));
    });
  };

  installBtn.onclick=()=>{
    const id=installBtn.dataset.id;
    if(!id){toast('请先生成 Skill');return;}
    installBtn.disabled=true;installBtn.textContent='安装中…';
    apiPost('/api/skill/install',{id:id}).then(d=>{
      installBtn.disabled=false;installBtn.textContent='安装到 WorkBuddy';
      if(!d.ok){toast('安装失败：'+(d.error||''));return;}
      toast('已安装到 '+ (d.path||'~/.workbuddy/skills/'));
    }).catch(e=>{installBtn.disabled=false;installBtn.textContent='安装到 WorkBuddy';toast('安装请求失败：'+apiErrorHint(e));});
  };
}

const TICKET_STATUS_META = {
  '新增':   {c:'#7d8da3', label:'新增'},
  '已修改': {c:'#60a5fa', label:'已修改'},
  '已合入': {c:'#34d399', label:'已合入'},
  '关闭':   {c:'#9ca3af', label:'关闭'},
  '拒绝':   {c:'#f87171', label:'拒绝'},
};
const TICKET_STATUS_OPTIONS = ['全部','新增','已修改','已合入','关闭','拒绝'];
const TICKET_TYPE_OPTIONS = ['全部','问题','需求'];
function ticketStatusBadge(s){
  const m = TICKET_STATUS_META[s] || {c:'#7d8da3', label:(s||'未知')};
  return `<span class="tk-badge" style="background:${m.c}1a;color:${m.c};border:1px solid ${m.c}55">${esc(m.label)}</span>`;
}
function ticketApiUrl(path){
  if(window.TICKET_API_BASE) return window.TICKET_API_BASE.replace(/\/$/,'') + path;
  return apiUrl(path);
}
function formatTicketTime(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  const pad = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function setTicketModalMode(isSubmit){
  const foot = document.querySelector('#ticketModalOverlay .tk-modal-f');
  if(!foot) return;
  foot.style.display = 'flex';
  const submitBtn = document.getElementById('tkm-submit');
  const cancelBtn = foot.querySelector('button:not(.primary)');
  if(submitBtn){ submitBtn.style.display = isSubmit?'inline-block':'none'; submitBtn.textContent='提交工单'; submitBtn.disabled=false; }
  if(cancelBtn){ cancelBtn.textContent = isSubmit?'取消':'关闭'; }
}

  body.innerHTML =

function closeTicketModal(){
  document.getElementById('ticketModalOverlay').classList.remove('show');
}
function submitTicketModal(){
  const submitBtn = document.getElementById('tkm-submit');
  const resultBox = document.getElementById('tkm-result');
  const payload = {
    user: document.getElementById('tkm-user').value.trim(),
    contact: document.getElementById('tkm-contact').value.trim(),
    type: document.getElementById('tkm-type').value,
    desc: document.getElementById('tkm-desc').value.trim(),
    expect: document.getElementById('tkm-expect').value.trim(),
  };
  if(!payload.type){ resultBox.innerHTML='<div class="tk-msg err">请选择类型</div>'; return; }
  if(!payload.desc){ resultBox.innerHTML='<div class="tk-msg err">请填写问题描述</div>'; return; }
  submitBtn.disabled = true; submitBtn.textContent='提交中…';
  resultBox.innerHTML='';
  fetch(ticketApiUrl('/api/ticket'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
    .then(r=>r.json().catch(()=>({ok:false,error:'后端未返回有效 JSON'})))
    .then(d=>{
      if(!d.ok){ resultBox.innerHTML='<div class="tk-msg err">提交失败：'+esc(d.error||'未知错误')+'</div>'; return; }
      let warn = d.warn ? '<div class="tk-msg warn">'+esc(d.warn)+'</div>' : '';
      resultBox.innerHTML = '<div class="tk-msg ok">✅ 工单已提交！工单号：<b>'+esc(d.ticket)+'</b>，当前状态：'+ticketStatusBadge(d.status)+'</div>'+warn;
      // 成功后刷新列表并延迟关闭弹窗
      loadTicketList();
      setTimeout(closeTicketModal, 1400);
    })
    .catch(e=>{ resultBox.innerHTML='<div class="tk-msg err">提交请求失败：'+esc(apiErrorHint(e))+'</div>'; })
    .finally(()=>{ submitBtn.disabled=false; submitBtn.textContent='提交工单'; });
}

      '<button class="btn primary" id="tk-new">+ 新建工单</button>'+
    '</div>'+
    '<div class="tk-table-wrap" id="tk-table-wrap"><div class="tk-loading">加载中…</div></div>';

  document.getElementById('tk-new').onclick = ()=>{
    openTicketModal();
  };
  const statusSel = document.getElementById('tk-filter-status');
  const typeSel = document.getElementById('tk-filter-type');
  const searchId = document.getElementById('tk-search-id');
  statusSel.onchange = loadTicketList;
  typeSel.onchange = loadTicketList;
  searchId.onkeydown = e=>{ if(e.key==='Enter'){ searchTicketById(searchId.value.trim().toUpperCase()); } };

}

function loadTicketList(){
  const wrap = document.getElementById('tk-table-wrap');
  if(!wrap) return;
  wrap.innerHTML = '<div class="tk-loading">加载中…</div>';
  const status = document.getElementById('tk-filter-status').value;
  const type = document.getElementById('tk-filter-type').value;
  let url = ticketApiUrl('/api/tickets');
  const params = [];
  if(status) params.push('status='+encodeURIComponent(status));
  if(type) params.push('type='+encodeURIComponent(type));
  if(params.length) url += (url.includes('?')?'&':'?') + params.join('&');
  fetch(url,{method:'GET'})
    .then(r=>r.json().catch(()=>({ok:false,error:'后端未返回有效 JSON'})))
    .then(d=>{
      if(!d.ok){ wrap.innerHTML='<div class="empty"><div class="big">⚠️</div>加载失败：'+esc(d.error||'未知错误')+'</div>'; return; }
      const items = d.items||[];
      if(!items.length){
        wrap.innerHTML='<div class="empty"><div class="big">🎫</div>暂无工单，点击右上角「新建工单」提交第一条反馈。</div>';
        return;
      }
      const rows = items.map(it=>{
        return '<tr data-ticket="'+esc(it.ticket)+'" style="cursor:pointer">'+
          '<td class="tdesc" title="'+esc(it.desc||'')+'">'+esc((it.desc||'—').replace(/\n/g,' '))+'</td>'+
          '<td>'+esc(it.type||'—')+'</td>'+
          '<td class="ttime">'+formatTicketTime(it.submit_time)+'</td>'+
          '<td>'+ticketStatusBadge(it.status)+'</td>'+
        '</tr>';
      }).join('');
      wrap.innerHTML =
        '<table><thead><tr><th>问题描述</th><th>类型</th><th>提出时间</th><th>状态</th></tr></thead>'+
        '<tbody>'+rows+'</tbody></table>';
      wrap.querySelectorAll('tbody tr').forEach(tr=>{
        tr.onclick = ()=>{ searchTicketById(tr.getAttribute('data-ticket')); };
      });
    })
    .catch(e=>{ wrap.innerHTML='<div class="empty"><div class="big">⚠️</div>加载失败：'+esc(apiErrorHint(e))+'</div>'; });
}

function searchTicketById(ticketId){
  if(!ticketId){ toast('请输入工单号'); return; }
  const overlay = document.getElementById('ticketModalOverlay');
  const body = document.getElementById('ticketModalBody');
  overlay.classList.add('show');
  setTicketModalMode(false);
  body.innerHTML = '<div class="tk-loading">查询工单 '+esc(ticketId)+' 中…</div>';
  fetch(ticketApiUrl('/api/ticket')+'?ticket='+encodeURIComponent(ticketId),{method:'GET'})
    .then(r=>r.json().catch(()=>({ok:false,error:'后端未返回有效 JSON'})))
    .then(d=>{
      if(!d.ok){ body.innerHTML='<div class="tk-msg err">查询失败：'+esc(d.error||'未知错误')+'</div>'; return; }
      if(!d.found){ body.innerHTML='<div class="tk-msg warn">未找到工单号 '+esc(ticketId)+'，请核对后重试。</div>'; return; }
      const f = d.fields||{};
      const rows = [
        ['工单号', esc(d.ticket)], ['当前状态', ticketStatusBadge(d.status)], ['类型', esc(f.type||'—')],
        ['用户名', esc(f.user||'—')], ['联系方式', esc(f.contact||'—')], ['问题描述', esc(f.desc||'—')],
        ['预期', esc(f.expect||'—')], ['处理备注', f.remark? esc(f.remark) : '<span class="muted">暂未填写</span>'],
      ];
      body.innerHTML = '<div class="tk-detail">'+
        rows.map(rw=>'<div class="tk-drow"><div class="tk-dk">'+rw[0]+'</div><div class="tk-dv">'+rw[1]+'</div></div>').join('')+
        '</div>';
    })
    .catch(e=>{ body.innerHTML='<div class="tk-msg err">查询请求失败：'+esc(apiErrorHint(e))+'</div>'; });
}

// ── 后端健康检查 ──
function checkBackend(){
  const el=document.getElementById('backend-status'); if(!el)return;
  fetch(apiUrl('/api/config'),{method:'GET'}).then(r=>{
    if(!r.ok) throw new Error('status '+r.status);
    const ct=(r.headers.get('content-type')||'');
    if(!ct.includes('application/json')) throw new Error('not json, ct='+ct);
    return r.json();
  }).then(d=>{
    if(d && d.ok===true){
      el.className='backend-status ok';
      el.innerHTML='● 后端已连接';
      el.title='控制台后端 '+getApiBase()+' 连接正常';
      window.BACKEND_OK=true;
    }else{
      throw new Error('unexpected payload');
    }
  }).catch(()=>{
    el.className='backend-status err';
    el.innerHTML='● 后端未连接';
    el.title='无法连接 '+getApiBase()+'。点击前往「设置」修改后端地址。';
    el.onclick=()=>switchTab('settings');
    window.BACKEND_OK=false;
  });
}

// ── Init ──
function init(data){
  DATA=data;
  window.STATIC_MODE = false;
  window.BACKEND_OK = undefined;
  document.getElementById('gen-time').textContent=data.generated_at.split(' ')[1];
  checkBackend();
  loadWorkshop(true);
  setInterval(checkBackend, 30000);
  const ov=data.overview, W=data.workshop||{stats:{parts:0,generations:0}};
  document.getElementById('b-skills').textContent=ov.total_skills;
  document.getElementById('b-skills').className='badge'+(ov.unused_skills?' warn':'');
  document.getElementById('b-storage').textContent=ov.total_storage;
  document.getElementById('b-shelf').textContent=W.stats.parts;
  document.getElementById('b-skilldev').textContent=W.stats.generations;
  document.getElementById('b-dismantle').textContent=W.stats.generations;
  document.getElementById('b-chat').textContent=(data.conversations&&data.conversations.total)||0;
  document.getElementById('b-anomalies').textContent=(data.anomalies&&data.anomalies.length)||0;
  updateSidebarBadges();
  document.querySelectorAll('.nav-item').forEach(n=>n.onclick=()=>switchTab(n.dataset.tab));

  // 侧边栏折叠
  const sidebar=document.getElementById('sidebar'), sbToggle=document.getElementById('sidebar-toggle');
  const saveSidebarState=()=>localStorage.setItem('wb_sidebar_collapsed', sidebar.classList.contains('collapsed')?'1':'0');
  const applySidebarState=()=>{
    const collapsed=localStorage.getItem('wb_sidebar_collapsed')==='1';
    sidebar.classList.toggle('collapsed', collapsed);
    document.querySelector('.app').classList.toggle('sidebar-collapsed', collapsed);
  };
  if(sidebar&&sbToggle){
    applySidebarState();
    sbToggle.addEventListener('click',(e)=>{e.stopPropagation(); sidebar.classList.toggle('collapsed'); document.querySelector('.app').classList.toggle('sidebar-collapsed'); saveSidebarState(); setTimeout(()=>{if(currentTab==='overview'&&document.getElementById('arena'))placeCapsules('detail');},220);});
    // 点击主内容区收起（移动端/小屏友好）
    document.querySelector('.main').addEventListener('click',()=>{
      if(window.innerWidth<900 && !sidebar.classList.contains('collapsed')){
        sidebar.classList.add('collapsed'); document.querySelector('.app').classList.add('sidebar-collapsed'); saveSidebarState();
      }
    });
  }

  initTooltip();
  const startTab=TAB_META[location.hash.slice(1)]?location.hash.slice(1):'overview';
  switchTab(startTab);
  window.addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(t!==currentTab&&TAB_META[t])switchTab(t);});
  // 首次布局可能arena尺寸为0，延迟重试保证平铺
  scheduleCapsuleLayout();
  // 启动即拉取配置填充 CFG 缓存（按钮门禁判断，避免未开设置页就误判未配置）
  fetch(apiUrl('/api/config')).then(r=>r.json()).then(d=>{ if(d.ok&&d.config){ const sh=d.config.skillhub||{}; const gh=d.config.github||{}; CFG.skillhub={api_key:sh.api_key||''}; CFG.github={token:gh.token||''}; } }).catch(()=>{});
}
fetch('console_data.json').then(r=>r.json()).then(init).catch(e=>{
  if (EMBEDDED_DATA) { window.STATIC_MODE = true; init(EMBEDDED_DATA); return; }
  document.getElementById('content').innerHTML=`<div class="empty">无法加载 console_data.json<br><br><span style="font-family:var(--mono);font-size:11px">请先运行：python scan_console.py</span></div>`;
});
