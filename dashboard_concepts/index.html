<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>概览页改版概念图</title>
<style>
  :root{
    --bg:#070a0f; --surface:#0d1219; --text:#e6edf3; --dim:#7d8da3;
    --cyan:#22d3ee; --purple:#a78bfa; --green:#34d399;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
    background:var(--bg); color:var(--text); padding:40px 24px;
    line-height:1.6;
  }
  h1{font-size:24px;margin-bottom:8px;letter-spacing:.5px}
  .sub{color:var(--dim);font-size:14px;margin-bottom:32px}
  .grid{display:grid;gap:28px;max-width:1400px;margin:0 auto}
  .card{background:var(--surface);border:1px solid rgba(255,255,255,.08);border-radius:16px;overflow:hidden}
  .card .head{padding:18px 20px;border-bottom:1px solid rgba(255,255,255,.08)}
  .card .head h2{font-size:16px;font-weight:600}
  .card .head p{font-size:12px;color:var(--dim);margin-top:4px}
  .card img{width:100%;height:auto;display:block}
  .footer{text-align:center;color:var(--dim);font-size:12px;margin-top:36px}
</style>
</head>
<body>
  <h1>WorkBuddy 控制台 · 概览页改版概念图</h1>
  <div class="sub">3 张方案：综合驾驶舱 / Skill 生命周期治理 / 零件工坊实时流水线</div>
  <div class="grid">
    <div class="card">
      <div class="head">
        <h2>1. Agent 运营驾驶舱（综合大盘）</h2>
        <p>健康指数 + 趋势 KPI + 业务流水线 + 存储/健康/告警联动</p>
      </div>
      <img src="overview_command_center.jpg" alt="Agent 运营驾驶舱">
    </div>
    <div class="card">
      <div class="head">
        <h2>2. Skill 生命周期治理大盘</h2>
        <p>Install → Active → Stale → Archived 流向 + 风险热力图 + 可操作建议</p>
      </div>
      <img src="skill_lifecycle_governance.jpg" alt="Skill 生命周期治理">
    </div>
    <div class="card">
      <div class="head">
        <h2>3. 零件工坊实时流水线</h2>
        <p>Requirement / Design / Code / Test / Tools / Reference 阶段化看板 + 最新组装</p>
      </div>
      <img src="part_workshop_pipeline.jpg" alt="零件工坊实时流水线">
    </div>
  </div>
  <div class="footer">本地预览 · 图片与页面同源部署</div>
</body>
</html>
